  function renderFooter(){if(view!=='game'||!run||run.over){$('footer').innerHTML='';return;}const s=run,c=G.cost(s),pending=s.pendingEvent;$('footer').innerHTML=`<footer class="actionbar"><div><p><strong>第 ${s.week} 周 · ${G.JOBS.find(j=>j.id===s.focus).name}</strong><span class="break-mobile">　${s.reserve?s.reserve+' 人尚未分配岗位':'岗位调整与主攻切换不消耗时间'}</span></p><p class="${s.money<c.total?'danger-text':''}" style="margin-top:4px">${pending?'完成当前选择后才能继续开发':s.money<c.total?'预算不足，请处理资金或结束项目':'推进后支付 '+yen(c.total)+'，并触发一次随机事件'}</p></div><div class="action-controls"><div class="pace" aria-label="开发节奏">${[['rest','休整'],['normal','正常'],['crunch','赶工']].map(([id,n])=>`<button data-action="pace" data-pace="${id}" title="${id==='rest'?'效率 70%，士气 +12':id==='crunch'?'效率 135%，士气 −10，增加问题与技术债':'标准效率，士气 +1'}" class="${s.pace===id?'selected':''}"${disabled(!busy())}>${n}</button>`).join('')}</div><button data-action="${pending?'prompt':'advance'}" class="btn-primary next-week"${disabled(pending||s.money>=c.total)}>${pending?'完成当前选择':'推进一周'}　→</button></div></footer>`;}
  const dialog=$('dialog');let dialogKind='';
  function showDialog(html,kind){dialogKind=kind;dialog.innerHTML=`<div class="dialog-body">${html}</div>`;if(!dialog.open)dialog.showModal();}
  function close(){dialog.close();dialogKind='';}
  function dialogHeader(eye,name,closable=true){return `<div class="dialog-header"><div><div class="eyebrow">${eye}</div><h2 id="dialog-title">${name}</h2></div>${closable?'<button class="close-btn" data-action="close" aria-label="关闭窗口">×</button>':''}</div>`;}
  function setup(genreId){if(run&&!run.over){showDialog(dialogHeader('ONE PROJECT AT A TIME','先完成当前项目。')+'<p class="dialog-desc">资金和整个团队共用一份生涯记录。请先发售或终止当前项目，再进入下一关。</p><div class="dialog-actions"><button data-action="close" class="btn-primary">继续当前项目</button></div>','setup-blocked');return;}setupGenre=genreId||setupGenre;const g=G.GENRES.find(g=>g.id===setupGenre);showDialog(dialogHeader('LEVEL '+meta.stage,'开始第 '+meta.stage+' 关。')+`
    <p class="dialog-desc">继承生涯资金 <strong>${yen(meta.wallet)}</strong>、${esc(meta.hero.name)}的五项能力，以及 ${meta.partners.length+2} 人的全局团队。每一关都使用当前余额，不再补发启动资金。</p><form id="setup-form"><div class="setup-genres">${G.GENRES.map(x=>`<button type="button" class="${x.id===setupGenre?'selected':''}" data-action="setup-genre" data-genre="${x.id}">${x.icon} ${x.name}</button>`).join('')}</div><label class="field"><span>作品名称</span><input name="name" maxlength="18" required value="${esc(g.title)}" autocomplete="off"></label><label class="field"><span>这款作品的目标 · 达成额外 +40 EXP</span><select name="objective"><option value="profit">商业回报：项目结余至少 ¥1,200</option><option value="acclaim">口碑佳作：综合真实评级至少 A-</option></select></label><div class="radio-line"><label><input type="radio" name="difficulty" value="normal" checked> 理想模式 · 稳定推进</label><label><input type="radio" name="difficulty" value="hard"> 真实模式 · 递减 / 牵连 / 随机返工</label></div><p class="quality-note">两种模式共用生涯资金。真实模式保留工资 +15%，非上架工作按完成度分段减速与返工。初始软上限 70%，事件解锁至 100%；上架没有软上限，始终正常推进。</p><details style="margin-top:17px;font-size:10px;color:var(--muted)"><summary>固定种子（可选，用于重玩同一组随机选择）</summary><label class="field" style="margin-top:10px"><input name="seed" type="number" min="1" max="4294967295" placeholder="留空则随机生成"></label></details><div id="setup-error" class="warning-note" role="alert"></div><div class="dialog-actions"><button type="button" class="btn-ghost" data-action="close">再想想</button><button class="btn-primary" type="submit">开始本次开发 →</button></div></form>`,'setup');}


  function showEvent(){const e=G.event(run);hiddenPrompt=false;showDialog(dialogHeader('WEEK '+String(run.week-1).padStart(2,'0')+' · '+e.tag,e.title)+`<div class="event-image" aria-hidden="true">${{inspiration:'✦',palette:'◈',coffee:'☕',backup:'▣',forms:'▤',feedback:'✉',bug:'⌘',showcase:'✧',scope:'◇',tired:'☾',break:'♧',discount:'◉',compat:'⌘',debt:'⌘'}[e.id]||'✦'}</div>${P.voice(run,e)}<p class="dialog-desc">${e.text}</p><div class="event-options">${e.choices.map((c,i)=>`<button class="event-option" data-action="event" data-index="${i}"${disabled(G.eventChoiceStatus(run,i).ok)}><div><strong>${c.label}</strong><small>${c.hint}${!G.eventChoiceStatus(run,i).ok?' · '+G.eventChoiceStatus(run,i).reason:''}</small></div><span>↗</span></button>`).join('')}</div><p class="quality-note">你的决定会自动保存。同一开发周只发生一次事件。</p>`,'event');}
  function result(){const r=run.result;showDialog(dialogHeader('THE TRUTH BEHIND THE QUESTION MARKS',r.released?'「'+esc(r.name)+'」发售了。':'把经验，留给下一作。')+`<div class="result-grade">${r.released?r.rating:'—'}<small>${r.released?'综合真实评级':'项目已终止'}</small></div>${r.ratings?`<div class="result-ratings">${G.GROUPS.filter(g=>g.id!=='release').map(g=>`<div><small>${g.rating}</small><strong>${r.ratings[g.id].grade}</strong></div>`).join('')}</div>`:''}<div class="result-grid"><div><label>开发时间</label><strong>${r.weeks} 周</strong></div><div><label>累计投入（含买量）</label><strong>${yen(r.cost)}</strong></div><div><label>自然收入</label><strong>${yen(r.organicRevenue)}</strong></div><div><label>买量净回款</label><strong>${yen(r.adRevenue)}</strong></div><div><label>买量投入 / 回款比例</label><strong>${yen(r.adSpend)} / ${r.released?(r.adRate*100).toFixed(1)+'%':'未发售'}</strong></div><div><label>项目结余（含融资）</label><strong class="${r.profit>=0?'teal':'red'}">${yen(r.profit)}</strong></div><div><label>本次制作经验</label><strong>+${r.exp} EXP</strong></div><div><label>结余资金 · 带入下一关</label><strong>${yen(r.walletEnd)}</strong></div></div><p class="result-note">共同完成：${r.team.map(m=>esc(m.name)).join('、')}<br>${r.objectiveOK?'✓ 制作人目标达成，额外 +40 EXP。':'本作未达成制作人目标，保留已获得的制作经验。'}<br>主角能力、全体伙伴和结余资金会带入下一关。</p><div class="dialog-actions"><button data-action="career" class="btn-ghost">查看作品履历</button><button data-action="setup" class="btn-primary">下一关 →</button></div>`,'result');}
  function release(){if(!G.canRelease(run))return;const f=G.forecast(run);showDialog(dialogHeader('READY TO SHIP','让玩家，给出最后的答案。')+`<p class="dialog-desc">资料准备和审核都已达到 100%，可以正式发售。其他工作无最低门槛，未完成部分会影响真实品质与收益。</p><div class="result-grid"><div><label>综合评级认知</label><strong>${esc(f.rating.text)}</strong></div><div><label>当前认知收入区间</label><strong>${yen(f.low)}—${yen(f.high)}</strong></div><div><label>其中买量回款区间</label><strong>${yen(f.ad.low)}—${yen(f.ad.high)}</strong></div><div><label>累计投入</label><strong>${yen(run.spent)}</strong></div></div><p class="quality-note">发售会揭晓四项真实评级和买量回款。宣传不足时，当前判断可能与实际差别很大。自然收入仍有 ±15% 市场波动；买量按发售时真实评级和投入金额结算。</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">继续开发</button><button data-action="confirm-release" class="btn-primary">正式发售 ↗</button></div>`,'release');}
  function help(){showDialog(dialogHeader('STRATEGY HANDBOOK','投入多少，知道多少，何时发售。')+`<div class="manual"><p><strong>五类十三项：</strong>游戏内容（题材、玩法、子主题）；程序构架（开发进度、系统协作、测试）；商业化（广告变现、用户付费、IP衍生）；宣发推广（宣传、买量）；上架（资料准备、审核进度）。在人物卡为每人安排一项工作，专业能力决定产出。</p><p><strong>工作与评级不同：</strong>完成度代表当前成果，评级是目前完成度加上本项目固定的大范围随机值。同一完成度也可能是 B 或 S；继续完善可以提高基础值，刷新和反复查看不重掷。</p><p><strong>两种上限：</strong>除上架外，11 项完成度初始软上限 70%。事件仅解锁更高上限，不直接增减完成度；上限按项保存，每次一般提高 15 个百分点，最高为刚性上限 100%。提高上限后还需安排工作，才会提高评级基础。横线标记当前软上限。</p><p><strong>理想与真实：</strong>理想模式工作稳定推进。真实模式以周初完成度判定：低于 30% 正常；30% 至不足 50% 效率 65%；50% 至 70% 效率 35%，正向推进的 20% 会随机扣除另一项非上架工作的完成度；超过 70% 增减各 50%，幅度为基础产能的 20%—100%，预览不透露本次结果。上架始终正常推进，也不会被其他工作牵连。两种模式都使用生涯余额，真实模式工资 +15%。</p><p><strong>先获得认知：</strong>四类评级初始为 ?????，宣传进度越高，问号越少。B???? 是粗略判断，可能偏离很远；宣传 100% 揭示当前真实评级。作品继续开发时，评级也会变化，认知范围随之更新。上架状态始终明确。</p><p><strong>宣发是选择：</strong>宣传用于了解作品；买量用于投入资金换取未来回款。安排买量岗位并选择预算后，每周扣费，未安排人手或预算 ¥0 不扣费。买量进度满后，继续安排仍会追加投放；发售前没有回款。</p><p><strong>投放与风险：</strong>综合真实评级按内容 40%、完善度 30%、商业化 20%、推广 10% 计算。净回款比例：D 档 15—40%，C 档 55—90%，B 档 105—140%，A 档 165—230%，S 档 270—380%；若签发行合作，再扣 22% 分成。C、D 档一定亏损，B 档起有回本机会。</p><p><strong>上架是硬条件：</strong>资料准备 100% 后才可推进审核；审核也到 100% 即可发售。其他工作不强制满进度，但提前发售可能得到低评级和亏损。</p><p><strong>局外成长：</strong>主角五项初始能力均为 100%，关卡之间可用经验训练，每次 +5、最高 200%。开发直接扣生涯资金，发售收入到账后继承到下一关，不重新发启动金。伙伴与结识名单也跨关保留。项目完成度、软上限、问题和士气在新项目重新开始。</p><p><strong>人物与成本：</strong>主角加阿策两人开局，伙伴随核心进度结识，并在加入后跨关留队。转到另一具体工作会磨合一周，即使同属一类；同岗第一人全额，其他人按 45% 协作产能计算。待命照付周薪。</p><p><strong>依赖与构筑：</strong>内容支持开发，开发支持系统协作和测试。系统协作持续偿债，测试持续修问题。内容 60% 可冻结范围，提高实现效率，放弃扩功能；解冻花 ¥180 并返工。功能会改变品质潜力和持续成本。</p><p><strong>每一周：</strong>支付工资、维护、工具和买量费用，推进安排，再触发一次事件。无固定周数上限。发售或终止结算经验，项目和生涯共同保存，能力、资金与全局伙伴跨关继承。</p></div><div class="dialog-actions"><button data-action="close" class="btn-primary">回到工作室</button></div>`,'help');}

  function finish(released){const r=G.finish(run,released);if(!r){toast('请先完成当前选择，或检查发售准备。');return;}meta=G.settle(meta,run);close();save();render();result();}
  document.addEventListener('change',e=>{const el=e.target;if(el.id==='ad-budget'&&run){G.setAdBudget(run,Number(el.value));render();return;}if(!el.matches('select[data-member]')||!run)return;const ok=G.assignMember(run,el.dataset.member,el.value);if(!ok)toast('这个岗位暂时不能分配。');render();});
  document.addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();const name=new FormData(e.target).get('heroName');if(!G.renameHero(meta,name))toast('请在项目结算后修改称呼。');render();return;}if(e.target.id!=='setup-form')return;e.preventDefault();const fd=new FormData(e.target);try{run=G.newRun({genre:setupGenre,name:fd.get('name'),hard:fd.get('difficulty')==='hard',seed:fd.get('seed'),objective:fd.get('objective')},meta);}catch(err){$('setup-error').textContent=err.message;return;}view='game';tab='work';hiddenPrompt=false;close();render();window.scrollTo({top:0,behavior:'smooth'});});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;e.preventDefault();const a=b.dataset.action;
    if(a==='close'){hiddenPrompt=true;close();return;}
    if(a==='audio'){const st=audio.getState();audio.setSettings({muted:!(st.settings?.muted??st.muted)});audio.unlock();return;}
    if(a==='help'){help();return;}
    if(a==='setup'){setup(b.dataset.genre);return;}
    if(a==='setup-genre'){const form=$('setup-form'),name=form.elements.name.value,mode=form.elements.difficulty.value,objective=form.elements.objective.value,seed=form.elements.seed.value,old=G.GENRES.find(g=>g.id===setupGenre).title;setup(b.dataset.genre);if(name&&name!==old)$('setup-form').elements.name.value=name;$('setup-form').elements.difficulty.value=mode;$('setup-form').elements.objective.value=objective;$('setup-form').elements.seed.value=seed;return;}
    if(['home','nav','continue','career'].includes(a)){view=a==='nav'?b.dataset.view:a==='continue'?'game':a==='career'?'career':'home';close();hiddenPrompt=false;render();window.scrollTo({top:0,behavior:'smooth'});return;}
    if(a==='result'){result();return;}
    if(a==='tab'){tab=b.dataset.tab;render();return;}
    if(a==='train'){if(!G.train(meta,b.dataset.skill))toast('当前无法训练，请检查经验或先结算项目。');render();return;}
    if(a==='career-hire'){if(!G.hirePartner(meta,b.dataset.id))toast('当前无法邀请，请检查资金或先结算项目。');render();return;}
    if(a==='career-dismiss'){const member=G.RECRUITS.find(r=>r.id===b.dataset.id);if(!member||meta.activeRunId)return;showDialog(dialogHeader('TEAM CHANGE','与'+esc(member.name)+'暂别？')+'<p class="dialog-desc">支付 ¥100，之后不再计算这位伙伴的工资。结识关系保留，后续可再次邀请。</p><div class="dialog-actions"><button data-action="close">继续同行</button><button data-action="confirm-career-dismiss" data-id="'+member.id+'">确认暂别 · ¥100</button></div>','career-dismiss');return;}
    if(a==='confirm-career-dismiss'){G.dismissPartner(meta,b.dataset.id);close();render();return;}
    if(a==='reset-career'){if(meta.activeRunId)return;showDialog(dialogHeader('A FRESH CAREER','重新开始整个生涯？')+'<p class="dialog-desc">资金恢复到 ¥7,600，主角五项能力恢复为 100%。伙伴、结识名单、经验和作品履历都会清空。</p><div class="dialog-actions"><button data-action="close">保留当前生涯</button><button data-action="confirm-reset-career">确认重新开始</button></div>','reset-career');return;}
    if(a==='confirm-reset-career'){if(meta.activeRunId)return;meta=G.emptyMeta();run=null;close();view='career';render();return;}
    if(!run||run.over)return;
    if(a==='prompt'){if(run.pendingEvent)showEvent();return;}
    if(a==='event'){if(G.resolveEvent(run,Number(b.dataset.index))){close();hiddenPrompt=false;render();}return;}
    if(a==='release'){release();return;}
    if(a==='dismiss'){const m=run.team.find(m=>m.id===b.dataset.id);if(!m||m.kind!=='partner'||busy())return;showDialog(dialogHeader('UNTIL NEXT TIME','与'+esc(m.name)+'暂别？')+`<p class="dialog-desc">支付 ¥100 安置费，之后不再计入${esc(m.name)}的周薪。本项目内不能再次邀请；结识关系会保留到后续关卡。此操作占用本周管理行动。</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">继续同行</button><button data-action="downsize" data-id="${m.id}">确认暂别 · ¥100</button></div>`,'dismiss');return;}
    if(a==='confirm-release'){finish(true);return;}
    if(a==='confirm-abort'){finish(false);return;}
    if(a==='abort'){showDialog(dialogHeader('PAUSE THIS PROJECT','结束这个项目？')+`<p class="dialog-desc">当前作品不会发售。已完成的 ${run.milestones.length} 个里程碑可保留 ${Math.min(30,run.milestones.length*8)} 点经验，已经花掉的资金不返还；剩余资金、主角能力和已加入的伙伴会带入下一关。</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">继续开发</button><button data-action="confirm-abort">结束并结算</button></div>`,'abort');return;}
    if(busy()){toast('请先完成当前随机事件选择。');return;}
    let ok=true;
    if(a==='focus'){run.focus=b.dataset.job;}
    if(a==='budget')ok=G.setAdBudget(run,Number(b.dataset.value));

    if(a==='freeze')ok=G.freeze(run);
    if(a==='pace'){run.pace=b.dataset.pace;}
    if(a==='assign')ok=G.assign(run,b.dataset.job,Number(b.dataset.delta));
    if(a==='hire')ok=G.hire(run,b.dataset.id);
    if(a==='downsize'){ok=G.downsize(run,b.dataset.id);close();}
    if(a==='feature')ok=G.feature(run,b.dataset.id);
    if(a==='cut')ok=G.cutFeature(run,b.dataset.id);
    if(a==='funding'){showDialog(dialogHeader('PUBLISHING PARTNERSHIP','给开发，多一点余地。')+`<p class="dialog-desc">发行商愿意预付 ¥2,200，换取本作发售收入的 22%。这笔资金不增加品质，也不降低完成度推进所需投入，每个项目只能签一次。</p><p class="quality-note">发售收入预估将自动按扣除分成后的数值显示。</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">先不合作</button><button class="btn-primary" data-action="confirm-funding">接受合作，获得 ¥2,200</button></div>`,'funding');return;}
    if(a==='confirm-funding'){ok=G.funding(run);close();}
    if(a==='advance'){const r=G.advance(run);ok=r.ok;if(!ok)toast(r.reason);hiddenPrompt=false;}
    if(!ok&&a!=='advance')toast('当前条件不满足，操作未执行。');render();
  });
  dialog.addEventListener('cancel',()=>{hiddenPrompt=true;dialogKind='';});
  document.addEventListener('keydown',e=>{if(e.key===' '&&view==='game'&&!dialog.open&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();document.querySelector('.next-week')?.click();}});
  // Terminating a project is always visible from its history tab, including an exhausted budget.
  const originalLogs=logs;logs=function(){return originalLogs()+(!run.over?'<div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn-ghost btn-small" data-action="abort">终止当前项目并结算</button></div>':'');};
  if(run&&run.over){meta=G.settle(meta,run);}render();
})();

</script>
</body>
</html>
