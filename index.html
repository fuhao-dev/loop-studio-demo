    else if(ceiling-s.work[m.job]<plan.production[m.job])notes.push(G.softCap(s,m.job)<1?'受软上限限制':'接近 100%');
    if(s.hard)notes.push('满效率预估，不含真实模式减速、返工与牵连');
    if(m.job!==m.lastJob)notes.push('转岗磨合 −'+Math.round(20*G.mods(s).ramp)+'%');
    const dependency=G.workDependency(s,m.job);if(dependency)notes.push('上游依赖：'+dependency.sources.map(source=>source.name+' '+(source.value*100).toFixed(1)+'%').join(' / ')+'；上游允许上限 '+(dependency.cap*100).toFixed(1)+'%');
    const shared=s.team.filter(p=>p.job===m.job).length>1?'（同岗合计）':'';
    return base+'<span class="production-estimate">本周岗位预计 '+amount+shared+'</span><span class="production-note">'+(notes.length?notes.join(' · '):'已计依赖与上限')+'</span>';
  }

  function memberCard(s,m,active,candidate=false,plan=G.progressEstimate(s)){const kind=candidate?'伙伴来信':m.kind==='hero'?'主角':m.kind==='companion'?'初始搭档':'团队伙伴';return `<article class="person-card ${m.id==='ace'?'person-ai':''}" data-person="${m.id}" style="--person-color:${m.color}"><div class="person-head">${portrait(m)}<div><span class="person-kind">${kind}</span><h3>${esc(m.name)}</h3><p>${esc(m.title)}</p></div></div><p class="person-bio">${esc(m.bio)}</p>${abilities(m)}<blockquote>“${esc(m.quote)}”</blockquote><div class="person-salary">基础周薪 <b>¥${m.salary}</b>${candidate?'<span>入组准备 ¥180</span>':`<span class="person-production">${productionEstimate(s,m,plan)}</span>`}</div>${candidate?`<button class="btn-teal person-join" data-action="hire" data-id="${m.id}"${disabled(active&&!s.managed&&s.money>=180&&G.teamSize(s)<8)}>邀请${esc(m.name)}入组 · ¥180</button>`:assignment(s,m,active)}${!candidate&&m.kind==='partner'?`<button class="person-dismiss" data-action="dismiss" data-id="${m.id}"${disabled(active&&!s.managed&&s.money>=100)}>与${esc(m.name)}暂别 · ¥100</button>`:''}</article>`;}
  function strip(s,active,plan=G.progressEstimate(s)){return `<section class="crew-section"><div class="section-heading"><div><h2>一起做游戏的人</h2><small>能力决定产能 · 每人每周专注一岗</small></div><button class="btn-small btn-ghost" data-action="tab" data-tab="team">查看人物卡 ↗</button></div><div class="crew-strip">${s.team.map(m=>`<article class="crew-mini" style="--person-color:${m.color}"><div class="crew-mini-head">${portrait(m)}<div><strong>${esc(m.name)} <small>${m.kind==='hero'?'主角':m.id==='ace'?'龙娘搭档':''}</small></strong><p>${summary(m)}</p></div></div>${assignment(s,m,active)}<small class="contribution">${productionEstimate(s,m,plan)}</small></article>`).join('')}</div></section>`;}
  function roster(s,active,plan=G.progressEstimate(s)){const candidates=G.availableRecruits(s);return `<p class="legend">100% 为标准能力；擅长 ≥130%，不会的岗位不能分配。天才程序员每项 145%，每周仍只负责一岗。同岗最有效成员发挥全产能，其余按协作效率折算；转岗磨合按每个人上周的实际岗位计算。</p><div class="people-grid">${s.team.map(m=>memberCard(s,m,active,false,plan)).join('')}</div><div class="section-heading"><div><h2>伙伴来信 <span class="pill gold">${candidates.length}</span></h2><small>随作品进展结识新伙伴，按团队缺口决定是否邀请</small></div></div>${candidates.length?`<div class="people-grid">${candidates.map(m=>memberCard(s,m,active,true,plan)).join('')}</div>`:'<section class="panel people-empty"><h3>下一个愿意与你同行的人，正在路上。</h3><p>可玩原型（核心平均 30%）：林绘 / 沈序<br>垂直切片（65%）：唐砚 / 温衡<br>内容完成：夏禾 / 陆简</p></section>'}<p class="legend" style="margin-top:18px">邀请和暂别占用本周管理行动；邀请不推进时间，新伙伴首周需要磨合。整个团队会带入下一关；主角与天才程序员始终留队。伙伴暂别后本项目不能再次邀请，但结识关系跨关保留。</p>`;}
  function voice(s,event){const v=G.teamVoice(s,event),m=s.team.find(m=>m.id===v.id);return `<div class="team-voice">${portrait(m)}<div><strong>${esc(v.name)}</strong><p>${esc(v.text)}</p></div></div>`;}
  window.StudioPeople={portrait,abilities,summary,assignment,productionEstimate,memberCard,strip,roster,voice};
})();

</script>
<script>
(function(){

      `<div class="metric-help-current">当前 ${s.debt.toFixed(1)} 点<span>程序产出系数 ×${(Math.max(.6,1-s.debt*.01)*100).toFixed(1)}%</span></div>

  }
  function positionMetricHelp(){
    if(!metricTrigger||metricPopup.hidden)return;
    const r=metricTrigger.getBoundingClientRect(),w=metricPopup.offsetWidth,h=metricPopup.offsetHeight,pad=12;

  }

  }

  function strategyPanel(s,p){const o=G.objectiveStatus(s,s.over&&s.result.released?s.result:undefined),f=G.forecast(s);return `<section class="strategy-panel"><div class="strategy-title"><div><span class="eyebrow">BUILD · LEARN · DECIDE</span><h2>${o.name} <span class="pill dim">${s.over?s.result.objectiveOK?'已达成':'未达成':o.ok?'有望达成':'开发中'}</span></h2><p>${s.objective==='acclaim'?'综合真实评级达到 A-':'发售后项目结余至少 ¥1,200'} · 达成额外 +40 EXP</p></div><div class="objective-value gold">${s.over&&s.result.released?s.objective==='acclaim'?s.result.rating:yen(s.result.profit):s.objective==='acclaim'?esc(f.rating.text):yen(f.low+s.income-s.spent)+'—'+yen(f.high+s.income-s.spent)}<small>${s.over?'实际结算':'基于当前认知，未计未来成本'}</small></div></div><div class="strategy-flow"><span>推进工作</span><b>→</b><span>积累真实品质</span><b>→</b><span>宣传验证认知</span><b>→</b><span>决定投放与发售</span></div><p class="quality-note">????? 表示完全未知；例如 B???? 是可能偏离真实值的初步判断。问号越少，误差越小。宣传改变认知，不会直接提高作品品质。</p></section>`;}
  function job(s,j,p,active){

      ${G.workDependency(s,j.id)?`<p class="dependency-note">↳ 上游依赖：${G.workDependency(s,j.id).sources.map(source=>source.name+' '+(source.value*100).toFixed(1)+'%').join(' / ')} · 上游允许上限 ${(G.workDependency(s,j.id).cap*100).toFixed(1)}%${j.id==='review'?'（资料准备须到 100%）':'（仍受本项软上限限制）'} · 按周初进度计算</p>`:''}

  function ratingTile(s,g){const v=g.id==='release'?null:G.ratingView(s,g.id),completion=G.groupProgress(s,g.id)*100,selected=workModule===g.id;return `<button type="button" role="tab" id="work-tab-${g.id}" aria-selected="${selected}" aria-controls="work-module-panel" tabindex="${selected?0:-1}" data-action="work-module" data-module="${g.id}" class="rating-summary-item ${selected?'selected':''}" style="--rating-color:${g.color}"><small>${g.rating}</small><strong class="rating-text"${v?' data-rating="'+g.id+'"':''}>${v?esc(v.text):G.complete(s)?'可上架':'未就绪'}</strong><span class="module-rating-note">${v?v.exact?'真实评级已揭示':v.level?'认知范围 '+v.lowGrade+'—'+v.highGrade:'未获得玩家反馈':'资料与审核均须完成'}</span><div class="module-completion"><span>总完成度</span><b>${completion.toFixed(1)}%</b></div><div class="module-progress" aria-hidden="true"><i style="width:${completion}%"></i></div></button>`;}

  function workGroup(s,g,p,active){const v=g.id==='release'?null:G.ratingView(s,g.id),list=G.JOBS.filter(j=>j.group===g.id);return `<section class="panel work-group" id="group-${g.id}" style="--group-color:${g.color}"><header class="work-group-head"><div><span class="eyebrow">${String(G.GROUPS.indexOf(g)+1).padStart(2,'0')} / ${g.id==='release'?'必须完成':'可自主取舍'}</span><h2>${g.icon} ${g.name}</h2><p class="group-total">总完成度 <b>${(G.groupProgress(s,g.id)*100).toFixed(1)}%</b> · ${list.length} 项工作</p></div><div class="group-verdict"><small>${g.rating}</small><strong>${v?esc(v.text):G.complete(s)?'可上架':'未就绪'}</strong>${v?`<span>${v.exact?'真实评级':v.level?'范围 '+v.lowGrade+'—'+v.highGrade:'等待反馈'}</span>`:`<span>上架总进度 ${Math.floor(G.groupProgress(s,'release')*100)}%</span>`}</div></header>${list.map(j=>job(s,j,p,active)).join('')}${g.id==='promotion'?marketing(s,active):g.id==='content'?`<div class="group-note"><span>${s.designLocked?'范围已冻结：程序 / 美术 +12%，不能扩功能。':'内容平均达 60% 可冻结范围，程序 / 美术 +12%。'}</span><button class="btn-small" data-action="freeze"${disabled(active&&!s.managed&&G.groupProgress(s,'content')>=.6&&(!s.designLocked||s.money>=180))}>${s.designLocked?'解冻 · ¥180':'冻结范围'}</button></div>`:g.id==='release'?'<p class="group-note">资料准备 100% 后才能推进审核。上架资格确定，不受评级随机值影响。</p>':''}</section>`;}
  function marketing(s,active){const a=G.adProjection(s),level=G.revealLevel(s);return `<div class="marketing-controls"><div class="reveal-progress"><strong>评级揭示 ${level} / 5</strong><span>宣传 0 / 1 / 25 / 50 / 75 / 100% 逐步缩小误差</span></div><p class="quality-note">宣传和买量都不影响发售资格。买量需要安排伙伴，并设置本周预算；未安排人手不扣投放费，¥0 暂停。</p><label class="field"><span>本周买量预算</span><select id="ad-budget" aria-label="本周买量预算"${disabled(active)}>${G.AD_BUDGETS.map(n=>`<option value="${n}"${s.adBudget===n?' selected':''}>${n===0?'暂停买量 · ¥0':yen(n)+' / 周'}</option>`).join('')}</select></label><div class="ad-ledger"><div><span>累计买量投入</span><b>${yen(a.spend)}</b></div><div><span>当前认知下净回款区间</span><b>${yen(a.low)}—${yen(a.high)}</b></div><div><span>预算转化比例（已扣分成）</span><b>${Math.round(a.lowRate*100)}%—${Math.round(a.highRate*100)}%</b></div></div><p class="quality-note">回款在发售时结算，按当时的综合真实评级：内容 40% / 完善度 30% / 商业化 20% / 推广 10%。C、D 档回款低于投入，B 档起有回本机会；发行分成会降低回款。评级未知时，区间很宽。</p></div>`;}

  function projectEntries(){const live=[...(run&&!run.over&&meta.activeRunId===run.id?[run]:[]),...meta.pausedProjects].map(s=>({id:s.id,stage:s.stage,name:s.name,scale:s.scale,hard:s.hard,status:s.paused?'paused':'active',weeks:s.week-1,cost:s.spent,revenue:null,profit:null,rating:null,team:s.team,totalCompletion:G.JOBS.reduce((n,j)=>n+G.progress(s,j.id),0)/G.JOBS.length*100,progress:Object.fromEntries(G.GROUPS.map(g=>[g.id,G.groupProgress(s,g.id)*100]))}));return [...live,...meta.history.map(r=>({...r,id:r.runId,status:r.released?'released':'aborted'}))].sort((a,b)=>b.stage-a.stage);}
  function developmentHistory(){const entries=projectEntries(),states=[['all','全部'],['active','开发中'],['paused','已暂停'],['released','已发售'],['aborted','已终止']],names=Object.fromEntries(states),shown=entries.filter(e=>historyFilter==='all'||e.status===historyFilter);return title('YOUR GAME LIBRARY','开发历史','每个点子都有自己的进度。暂停、继续，或回看已经交付的作品。',`<button class="btn-primary" data-action="setup">＋ 新项目</button>`)+`<div class="history-overview">${[['全部产品',entries.length],['正在开发',entries.filter(e=>e.status==='active').length+' / 1'],['已暂停',meta.pausedProjects.length],['已发售',meta.history.filter(e=>e.released).length]].map(([name,n])=>`<div class="stat"><span class="label">${name}</span><div class="value">${n}</div></div>`).join('')}</div><p class="history-note">资金与团队由所有项目共用。暂停不产生开发周成本；恢复时同步当前余额、成员与能力，保留项目进度、分工和随机事件。同一时间只能开发一个项目。</p><div class="history-filters" aria-label="产品状态筛选">${states.map(([id,name])=>`<button data-action="history-filter" data-filter="${id}" aria-pressed="${historyFilter===id}" class="${historyFilter===id?'selected':''}">${name} <span>${id==='all'?entries.length:entries.filter(e=>e.status===id).length}</span></button>`).join('')}</div><div class="project-library">${shown.length?shown.map(e=>`<article class="panel project-record" data-project="${e.id}"><div class="project-record-head"><div><div class="eyebrow">PROJECT ${String(e.stage).padStart(2,'0')} · ${G.SCALES.find(g=>g.id===e.scale).name} · ${e.hard?'真实模式':'理想模式'}</div><h2>${esc(e.name)} <span class="project-status ${e.status}">${names[e.status]}</span></h2></div><div class="project-record-actions">${e.status==='active'?'<button class="btn-small btn-ghost" data-action="pause-project">暂停项目</button><button class="btn-teal btn-small" data-action="nav" data-view="game">继续开发 ↗</button>':e.status==='paused'?`<button class="btn-teal btn-small" data-action="resume-project" data-id="${e.id}">${meta.activeRunId?'切换到此项目':'恢复开发'} ↗</button>`:`<strong class="history-grade">${e.released?e.rating:'—'}</strong><button class="btn-small" data-action="history-result" data-id="${e.id}">查看结算报告</button>`}</div></div><div class="project-record-stats"><div><small>已开发</small><b>${e.weeks} 周</b></div><div><small>开发总完成度</small><b>${e.totalCompletion.toFixed(1)}%</b></div><div><small>累计投入</small><b>${yen(e.cost)}</b></div><div><small>发售收入</small><b>${e.revenue===null?'未发售':yen(e.revenue)}</b></div><div><small>项目盈亏</small><b class="${e.profit===null?'':e.profit>=0?'teal':'red'}">${e.profit===null?'待结算':yen(e.profit)}</b></div></div><details class="history-details"><summary>各模块进度与制作团队</summary><div class="history-progress">${G.GROUPS.map(g=>`<div><span>${g.rating}</span><b>${e.progress[g.id].toFixed(1)}%</b>${bar(e.progress[g.id],100,g.color)}</div>`).join('')}</div><p>制作团队：${e.team.map(m=>esc(m.name)).join('、')}</p>${e.status==='released'?'<p>仅上架两项为发售硬条件，其他模块可以未满进度。</p>':''}</details></article>`).join(''):`<section class="panel empty"><h2>${entries.length?'这个状态下还没有作品。':'你的第一款作品，从这里开始。'}</h2><p>${entries.length?'切换筛选可以查看其他项目。':'立项后，这里会保留每个项目的开发与发售情况。'}</p></section>`}</div>`;}
  function pauseCurrentProject(nextView='history'){if(!run||!G.pauseProject(meta,run)){toast('当前项目无法暂停。');return false;}run=null;view=nextView;tab='work';hiddenPrompt=false;close();render();window.scrollTo(0,0);return true;}

  function careerStats(){return `<div class="career-summary"><div class="stat"><span class="label">生涯资金</span><div class="value gold">${yen(meta.wallet)}</div><span class="note">所有项目共用的当前余额</span></div><div class="stat"><span class="label">${meta.activeRunId?'当前项目':'下个项目'}</span><div class="value teal">${meta.activeRunId&&run?run.stage:meta.stage}<small>号</small></div><span class="note">${meta.partners.length+2} 位全局团队成员</span></div><div class="stat"><span class="label">可用训练经验</span><div class="value">${meta.exp}<small>EXP</small></div><span class="note">训练能力后永久保留</span></div></div>`;}
  function career(){const released=meta.history.filter(h=>h.released),active=!!meta.activeRunId,team=[{...G.HERO,name:meta.hero.name,skills:meta.hero.skills},G.COMPANION,...meta.partners.map(id=>G.RECRUITS.find(r=>r.id===id))],candidates=G.RECRUITS.filter(r=>meta.knownPartners.includes(r.id)&&!meta.partners.includes(r.id));return title('YOUR STUDIO CAREER','人、能力与资金，一起走到下一关。','项目的完成度重新开始，生涯的积累持续保留。')+careerStats()+`
    <section class="panel"><div class="panel-head"><h2>主角成长 · ${esc(meta.hero.name)}</h2><span class="pill">${active?'暂停或结算项目后可训练':'没有开发中项目时可训练'}</span></div><div class="panel-body"><form id="profile-form" class="profile-form"><label class="field"><span>主角称呼</span><input name="heroName" maxlength="12" required value="${esc(meta.hero.name)}"${disabled(!active)}></label><button class="btn-small"${disabled(!active)}>保存称呼</button></form><p class="quality-note">基础能力均为 100%。每次训练 +5，最高 200%；消耗经验，资金不变。训练后的能力带入后续每一个项目。</p><div class="growth-list">${G.SKILLS.map(j=>{const n=meta.hero.skills[j.id],price=G.trainingCost(meta,j.id);return `<div class="growth-row"><strong>${j.name}</strong><div class="ability-bar" style="--ability-color:${j.color}"><i style="width:${n/2}%"></i></div><b>${n}%</b><button class="btn-small" data-action="train" data-skill="${j.id}"${disabled(!active&&n<200&&meta.exp>=price)}>${n>=200?'已达上限':'+5 · '+price+' EXP'}</button></div>`;}).join('')}</div></div></section>
    <div class="section-heading"><h2>全局团队 · ${team.length} / 8</h2><small>伙伴加入后跨关留队，工资按当前团队计算</small></div><div class="global-team">${team.map(m=>`<article class="panel global-person">${P.portrait(m)}<div><h3>${esc(m.name)}</h3><p>${m.id==='hero'?'主角 · 能力永久成长':m.id==='ace'?'全能搭档':esc(m.title)}</p><small>基础周薪 ${yen(m.salary)}</small></div>${m.id!=='hero'&&m.id!=='ace'?`<button class="btn-small" data-action="career-dismiss" data-id="${m.id}"${disabled(!active&&meta.wallet>=100)}>暂别 · ¥100</button>`:'<span class="pill dim">固定成员</span>'}</article>`).join('')}</div>
    <div class="section-heading"><h2>已结识 · 待邀请 ${candidates.length} 人</h2><small>项目里程碑结识的伙伴会全局保留</small></div>${candidates.length?`<div class="global-team">${candidates.map(m=>`<article class="panel global-person">${P.portrait(m)}<div><h3>${esc(m.name)}</h3><p>${esc(m.title)} · ${P.summary(m)}</p><small>基础周薪 ${yen(m.salary)}</small></div><button class="btn-small" data-action="career-hire" data-id="${m.id}"${disabled(!active&&team.length<8&&meta.wallet>=180)}>邀请 · ¥180</button></article>`).join('')}</div>`:'<p class="legend">继续开发作品，完成原型、垂直切片与完整内容，结识更多伙伴。</p>'}
    <section class="panel career-history-link"><div><h2>开发历史 · 已发售 ${released.length} 款</h2><p>查看正在开发、暂停、已发售和已终止的全部产品。</p></div><button data-action="nav" data-view="history" class="btn-small">打开开发历史 ↗</button></section>
    <p class="quality-note" style="margin-top:24px">资金不足时可以主动重新开始生涯，重置资金、能力、伙伴和履历。</p><button class="btn-ghost btn-small" data-action="reset-career"${disabled(!active)}>重新开始生涯</button>`;}

  function render(){const guide=$('workbench-guide');if(guide)guideOpen=guide.open;hideMetricHelp();G.syncCareer(meta,run);const labels={home:'工作室大厅',game:'开发现场',career:'局外生涯',history:'开发历史'};document.querySelectorAll('.sidebar nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('location').textContent=labels[view];$('run-dot').style.display=run&&!run.over?'':'none';$('meta-mini').innerHTML='<div class="side-growth"><small>生涯资金</small><div style="margin-top:8px"><strong class="gold">'+yen(meta.wallet)+'</strong></div><p>可用经验 '+meta.exp+' EXP<br>全局团队 '+(meta.partners.length+2)+' 人 · 已暂停 '+meta.pausedProjects.length+' 个项目'+'</p></div>';
    $('app').innerHTML=({home,game,career,history:developmentHistory}[view])();renderFooter();save();if(view==='game'&&!hiddenPrompt&&run&&!run.over&&run.pendingEvent)showEvent();}
  function renderFooter(){if(view!=='game'||!run||run.over){$('footer').innerHTML='';return;}const s=run,c=G.cost(s),pending=s.pendingEvent;$('footer').innerHTML=`<footer class="actionbar"><div><p><strong>第 ${s.week} 周 · 团队开发</strong><span class="break-mobile">　${s.reserve?s.reserve+' 人尚未分配岗位':'岗位调整不消耗时间'}</span></p><p class="${s.money<c.total?'danger-text':''}" style="margin-top:4px">${pending?'完成当前选择后才能继续开发':s.money<c.total?'预算不足，请处理资金或结束项目':'推进后支付 '+yen(c.total)+'，并触发一次随机事件'}</p></div><div class="action-controls"><div class="pace" aria-label="开发节奏">${[['rest','休整'],['normal','正常'],['crunch','赶工']].map(([id,n])=>`<button data-action="pace" data-pace="${id}" title="${id==='rest'?'效率 70%，士气 +12':id==='crunch'?'效率 135%，士气 −10，增加问题与技术债':'标准效率，士气 +1'}" class="${s.pace===id?'selected':''}"${disabled(!busy())}>${n}</button>`).join('')}</div><button data-action="${pending?'prompt':'advance'}" class="btn-primary next-week"${disabled(pending||s.money>=c.total)}>${pending?'完成当前选择':'推进一周'}　→</button></div></footer>`;}
  const metricPopup=document.createElement('aside');metricPopup.id='metric-help';metricPopup.className='metric-help';metricPopup.hidden=true;
  metricPopup.setAttribute('role','dialog');metricPopup.setAttribute('aria-modal','false');metricPopup.setAttribute('aria-labelledby','metric-help-title');document.body.append(metricPopup);
  let metricTrigger=null,metricPinned=false,metricHideTimer,suppressMetricFocus=false;
  document.addEventListener('pointerover',e=>{const b=e.target.closest('[data-metric-help]');if(b&&e.pointerType!=='touch'&&!metricPinned)showMetricHelp(b);});
  document.addEventListener('pointerout',e=>{const b=e.target.closest('[data-metric-help]');if(b&&!b.contains(e.relatedTarget)&&!metricPopup.contains(e.relatedTarget)&&!metricPinned)scheduleMetricHide();});
  metricPopup.addEventListener('pointerenter',()=>clearTimeout(metricHideTimer));
  metricPopup.addEventListener('pointerleave',e=>{if(!metricPinned&&!metricTrigger?.contains(e.relatedTarget))scheduleMetricHide();});
  document.addEventListener('focusin',e=>{const b=e.target.closest('[data-metric-help]');if(b){if(!suppressMetricFocus&&metricTrigger!==b)showMetricHelp(b);}else if(metricTrigger&&!metricPopup.contains(e.target))hideMetricHelp();});
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-metric-help]');
    if(b){e.preventDefault();if(metricTrigger===b&&metricPinned)hideMetricHelp();else showMetricHelp(b,true);return;}
    if(e.target.closest('.metric-help-close')){hideMetricHelp(true);return;}
    if(metricTrigger&&!metricPopup.contains(e.target))hideMetricHelp();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!metricPopup.hidden){e.preventDefault();hideMetricHelp(true);}});
  window.addEventListener('resize',()=>hideMetricHelp());
  window.addEventListener('scroll',positionMetricHelp,true);

  const dialog=$('dialog');let dialogKind='';
  function showDialog(html,kind){hideMetricHelp();dialogKind=kind;dialog.innerHTML=`<div class="dialog-body">${html}</div>`;if(!dialog.open)dialog.showModal();}
  function close(){dialog.close();dialogKind='';}
  function dialogHeader(eye,name,closable=true){return `<div class="dialog-header"><div><div class="eyebrow">${eye}</div><h2 id="dialog-title">${name}</h2></div>${closable?'<button class="close-btn" data-action="close" aria-label="关闭窗口">×</button>':''}</div>`;}
  function updateProjectNameValidation(){
    const form=$('setup-form');if(!form)return false;
    const input=form.elements.name,status=G.projectNameStatus(input.value),warning=$('project-name-error');
    input.setCustomValidity(status.reason);input.setAttribute('aria-invalid',String(!status.ok));
    warning.textContent=status.reason;warning.hidden=status.ok;
    const affordable=meta.wallet>=G.scalePlan(setupScale).minFunds,button=form.querySelector('button[type="submit"]');
    button.disabled=!affordable||!status.ok;
    button.textContent=!affordable?'资金不足，无法立项':status.ok?'开始本次开发 →':'请修改作品名称';
    return status.ok;
  }

  function setup(scaleId){if(run&&!run.over){showDialog(dialogHeader('ONE PROJECT AT A TIME','先暂停，再开始新的点子。')+'<p class="dialog-desc">当前项目会保留进度、分工与随机事件，不结算经验，也不退回已花掉的资金。暂停后可以立项，或在开发历史中随时恢复。</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">继续当前项目</button><button data-action="pause-setup" data-scale="'+(scaleId||setupScale)+'" class="btn-primary">暂停当前项目并立项</button></div>','setup-blocked');return;}setupScale=scaleId||setupScale;const g=G.SCALES.find(g=>g.id===setupScale),plan=G.scalePlan(g.id),affordable=meta.wallet>=plan.minFunds;showDialog(dialogHeader('PROJECT '+meta.stage,'开始第 '+meta.stage+' 个项目。')+`
    <p class="dialog-desc">继承生涯资金 <strong>${yen(meta.wallet)}</strong>、${esc(meta.hero.name)}的五项能力，以及 ${meta.partners.length+2} 人的全局团队。所有项目共用当前余额，不额外发放启动资金。</p><form id="setup-form"><div class="setup-scales">${G.SCALES.map(x=>`<button type="button" class="${x.id===setupScale?'selected':''}" data-action="setup-scale" data-scale="${x.id}">${x.icon} ${x.name}<small>${G.scalePlan(x.id).personWeeks.toLocaleString("zh-CN")} 人周 · ${meta.wallet<G.scalePlan(x.id).minFunds?'资金不足':'可立项'}</small></button>`).join('')}</div><div class="scale-explainer"><strong>${g.name} · 需要 ${plan.personWeeks.toLocaleString("zh-CN")} 人周工作量</strong><p>以 100% 能力计算，每人每周基础产出 ${G.STANDARD_WEEKLY_WORK} 点，即 1 标准人周。同能力、同状态的人员每周产出相同；实际开发还受士气、磨合、协作与模式影响。</p><div class="setup-funds ${affordable?'':'insufficient'}"><b>立项需要 ${yen(plan.minFunds)} · 当前 ${yen(meta.wallet)}</b><span>${affordable?'资金充足，可以开始开发':'资金不足，还差 '+yen(plan.minFunds-meta.wallet)}</span><small>每标准人周按 ${yen(G.STANDARD_PERSON_WEEK_COST)} 校验启动资金，仅为立项门槛，不预扣款；实际支出仍按周结算。</small></div><small>规模影响全部 13 项工作和功能扩展的需求；各规模共用评级与收益规则。${g.multiplier>1?' 建议先积累资金与团队，再挑战较大规模。':' 适合从这里开始积累生涯。'}</small></div><label class="field"><span>作品名称</span><input id="project-name" name="name" maxlength="18" required value="${esc(g.title)}" autocomplete="off" aria-describedby="project-name-error" aria-invalid="false"><small id="project-name-error" class="name-warning" aria-live="polite" hidden></small></label><label class="field"><span>这款作品的目标 · 达成额外 +40 EXP</span><select name="objective"><option value="profit">商业回报：项目结余至少 ¥1,200</option><option value="acclaim">口碑佳作：综合真实评级至少 A-</option></select></label><div class="radio-line"><label><input type="radio" name="difficulty" value="normal" checked> 理想模式 · 稳定推进</label><label><input type="radio" name="difficulty" value="hard"> 真实模式 · 感受一下现实吧</label></div><details style="margin-top:17px;font-size:10px;color:var(--muted)"><summary>固定种子（可选，用于重玩同一组随机选择）</summary><label class="field" style="margin-top:10px"><input name="seed" type="number" min="1" max="4294967295" placeholder="留空则随机生成"></label></details><div id="setup-error" class="warning-note" role="alert"></div><div class="dialog-actions"><button type="button" class="btn-ghost" data-action="close">再想想</button><button class="btn-primary" type="submit"${disabled(affordable)}>${affordable?'开始本次开发 →':'资金不足，无法立项'}</button></div></form>`,'setup');updateProjectNameValidation();}


  function showEvent(){const e=G.event(run);hiddenPrompt=false;showDialog(dialogHeader('WEEK '+String(run.week-1).padStart(2,'0')+' · '+e.tag,e.title)+`<div class="event-image" aria-hidden="true">${{inspiration:'✦',palette:'◈',coffee:'☕',backup:'▣',forms:'▤',feedback:'✉',bug:'⌘',showcase:'✧',scope:'◇',tired:'☾',break:'♧',discount:'◉',compat:'⌘',debt:'⌘'}[e.id]||'✦'}</div>${P.voice(run,e)}<p class="dialog-desc">${e.text}</p><div class="event-options">${e.choices.map((c,i)=>`<button class="event-option" data-action="event" data-index="${i}"${disabled(G.eventChoiceStatus(run,i).ok)}><div><strong>${c.label}</strong><small>${c.hint}${!G.eventChoiceStatus(run,i).ok?' · '+G.eventChoiceStatus(run,i).reason:''}</small></div><span>↗</span></button>`).join('')}</div><p class="quality-note">你的决定会自动保存。同一开发周只发生一次事件。</p>`,'event');}
  function result(project=run){const r=project.result||project;showDialog(dialogHeader('THE TRUTH BEHIND THE QUESTION MARKS',r.released?'「'+esc(r.name)+'」发售了。':'把经验，留给下一作。')+`<div class="result-grade">${r.released?r.rating:'—'}<small>${r.released?'综合真实评级':'项目已终止'}</small></div>${r.ratings?`<div class="result-ratings">${G.GROUPS.filter(g=>g.id!=='release').map(g=>`<div><small>${g.rating}</small><strong>${r.ratings[g.id].grade}</strong></div>`).join('')}</div>`:''}<div class="result-grid"><div><label>项目规模</label><strong>${G.SCALES.find(g=>g.id===r.scale).name}</strong></div><div><label>开发时间</label><strong>${r.weeks} 周</strong></div><div><label>累计投入（含买量）</label><strong>${yen(r.cost)}</strong></div><div><label>自然收入</label><strong>${yen(r.organicRevenue)}</strong></div><div><label>买量净回款</label><strong>${yen(r.adRevenue)}</strong></div><div><label>买量投入 / 回款比例</label><strong>${yen(r.adSpend)} / ${r.released?(r.adRate*100).toFixed(1)+'%':'未发售'}</strong></div><div><label>项目结余（含融资）</label><strong class="${r.profit>=0?'teal':'red'}">${yen(r.profit)}</strong></div><div><label>本次制作经验</label><strong>+${r.exp} EXP</strong></div><div><label>结算时生涯余额</label><strong>${yen(r.walletEnd)}</strong></div></div><p class="result-note">共同完成：${r.team.map(m=>esc(m.name)).join('、')}<br>${r.objectiveOK?'✓ 制作人目标达成，额外 +40 EXP。':'本作未达成制作人目标，保留已获得的制作经验。'}<br>所有项目共用主角能力、全局团队和生涯资金。</p><div class="dialog-actions"><button data-action="nav" data-view="history" class="btn-ghost">查看开发历史</button><button data-action="setup" class="btn-primary">新项目 →</button></div>`,'result');}
  function release(){if(!G.canRelease(run))return;const f=G.forecast(run);showDialog(dialogHeader('READY TO SHIP','让玩家，给出最后的答案。')+`<p class="dialog-desc">资料准备和审核都已达到 100%，可以正式发售。其他工作无最低门槛，未完成部分会影响真实品质与收益。</p><div class="result-grid"><div><label>综合评级认知</label><strong>${esc(f.rating.text)}</strong></div><div><label>当前认知收入区间</label><strong>${yen(f.low)}—${yen(f.high)}</strong></div><div><label>其中买量回款区间</label><strong>${yen(f.ad.low)}—${yen(f.ad.high)}</strong></div><div><label>累计投入</label><strong>${yen(run.spent)}</strong></div></div><p class="quality-note">发售会揭晓四项真实评级和买量回款。宣传不足时，当前判断可能与实际差别很大。自然收入仍有 ±15% 市场波动；买量按发售时真实评级和投入金额结算。</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">继续开发</button><button data-action="confirm-release" class="btn-primary">正式发售 ↗</button></div>`,'release');}
  function help(){showDialog(dialogHeader('STRATEGY HANDBOOK','投入多少，知道多少，何时发售。')+`<div class="manual"><p><strong>四档规模：</strong>微型、小型、中型、大型分别需要 54.4、163.2、489.6、1468.8 标准人周工作量。100% 能力每周基础产出 10 点为 1 人周，立项需持有每标准人周 ¥100 的资金，不预扣款。相同人员与状态，每周产出相同；完成度 = 已完成工作 ÷ 总需求。因此同一周工作，在小项目推进更多完成度。规模影响全部 13 项工作和功能扩展；上架仍没有软上限，但也需要完成该规模的全部上架工作。各规模共用评级与收益规则，请用资金和团队支持更长的开发。</p><p><strong>五类十三项：</strong>游戏内容（题材、玩法、子主题）；程序构架（开发进度、系统协作、测试）；商业化（广告变现、用户付费、IP衍生）；宣发推广（宣传、买量）；上架（资料准备、审核进度）。在人物卡为每人安排一项工作，专业能力决定产出。</p><p><strong>工作与评级不同：</strong>完成度代表当前成果，评级是目前完成度加上本项目固定的大范围随机值。同一完成度也可能是 B 或 S；继续完善可以提高基础值，刷新和反复查看不重掷。</p><p><strong>两种上限：</strong>除上架外，11 项完成度初始软上限 70%。事件仅解锁更高上限，不直接增减完成度；上限按项保存，每次一般提高 15%，最高为刚性上限 100%。提高上限后还需安排工作，才会提高评级基础。横线标记当前软上限。</p><p><strong>理想与真实：</strong>理想模式工作稳定推进。真实模式以周初完成度判定：低于 30% 正常；30% 至不足 50% 效率 65%；50% 至 70% 效率 35%，正向推进的 20% 会随机扣除另一项非上架工作的完成度；超过 70% 增减各 50%，幅度为基础产能的 20%—100%，预览不透露本次结果。上架始终正常推进，也不会被其他工作牵连。两种模式都使用生涯余额，工资规则相同。</p><p><strong>先获得认知：</strong>四类评级初始为 ?????，宣传进度越高，问号越少。B???? 是粗略判断，可能偏离很远；宣传 100% 揭示当前真实评级。作品继续开发时，评级也会变化，认知范围随之更新。上架状态始终明确。</p><p><strong>宣发是选择：</strong>宣传用于了解作品；买量用于投入资金换取未来回款。安排买量岗位并选择预算后，每周扣费，未安排人手或预算 ¥0 不扣费。买量进度满后，继续安排仍会追加投放；发售前没有回款。</p><p><strong>投放与风险：</strong>综合真实评级按内容 40%、完善度 30%、商业化 20%、推广 10% 计算。净回款比例：D 档 15—40%，C 档 55—90%，B 档 105—140%，A 档 165—230%，S 档 270—380%；若签发行合作，再扣 22% 分成。C、D 档一定亏损，B 档起有回本机会。</p><p><strong>上架是硬条件：</strong>资料准备 100% 后才可推进审核；审核也到 100% 即可发售。其他工作不强制满进度，但提前发售可能得到低评级和亏损。</p><p><strong>局外成长：</strong>主角五项初始能力均为 100%，关卡之间可用经验训练，每次 +5、最高 200%。开发直接扣生涯资金，发售收入到账后继承到下一关，不重新发启动金。伙伴与结识名单也跨关保留。项目完成度、软上限、问题和士气在新项目重新开始。</p><p><strong>人物与成本：</strong>主角加天才程序员两人开局，伙伴随核心进度结识，并在加入后跨关留队。转到另一具体工作会磨合一周，即使同属一类；同岗第一人全额，其他人按 45% 协作产能计算。待命照付周薪。</p><p><strong>依赖与构筑：</strong>内容支持开发，开发支持系统协作和测试。系统协作持续偿债，测试持续修问题。内容 60% 可冻结范围，提高实现效率，放弃扩功能；解冻花 ¥180 并返工。功能会改变品质潜力和持续成本。</p><p><strong>暂停与切换：</strong>同一时间只推进一个项目。暂停保留进度、分工、事件与随机结果，不发经验、不产生开发周成本；恢复同步共用资金、全局团队和能力。通过开发历史查看、恢复或切换项目，新立项仍需满足资金门槛。<br><br><strong>每一周：</strong>支付工资、维护、工具和买量费用，推进安排，再触发一次事件。无固定周数上限。发售或终止结算经验，项目和生涯共同保存，能力、资金与全局伙伴跨关继承。</p></div><div class="dialog-actions"><button data-action="close" class="btn-primary">回到工作室</button></div>`,'help');}

  function showWorkCapWarning(warnings){
    showDialog(dialogHeader('CHECK YOUR ASSIGNMENTS','有伙伴的工作已到达上限。')+`<p class="dialog-desc">这些岗位的完成度已到上限，继续安排不会产生正向完成度收益。可以返回调整分工，也可以确认继续推进。</p><ul class="work-cap-list">${warnings.map(w=>`<li><strong>${esc(w.members.map(m=>m.name).join('、'))} · ${w.name}</strong><span>当前 ${w.completion.toFixed(1)}% / ${w.full?'刚性上限':'软上限'} ${w.cap}%</span>${w.ongoing?'<small>'+w.ongoing+'。</small>':''}${w.rework?'<small>真实模式下仍可能返工，降低当前完成度。</small>':''}</li>`).join('')}</ul><p class="warning-note">继续推进仍会支付本周工资、维护和投放等费用。${run.hard?'真实模式的实际结算仍包含阶段减速、返工与牵连。':''}</p><div class="dialog-actions"><button data-action="close" class="btn-primary">返回调整分工</button><button data-action="confirm-advance" data-run="${run.id}" data-week="${run.week}" class="btn-ghost">仍然推进一周 →</button></div>`,'work-cap-warning');
  }
  function advanceWeek(){const result=G.advance(run);if(!result.ok)toast(result.reason);hiddenPrompt=false;render();}

  function finish(released){const r=G.finish(run,released);if(!r){toast('请先完成当前选择，或检查发售准备。');return;}meta=G.settle(meta,run);close();save();render();result();}
  document.addEventListener('input',e=>{if(e.target.matches('#setup-form input[name="name"]')&&!e.isComposing){$('setup-error').textContent='';updateProjectNameValidation();}});
  document.addEventListener('compositionend',e=>{if(e.target.matches('#setup-form input[name="name"]'))updateProjectNameValidation();});
  document.addEventListener('change',e=>{const el=e.target;if(el.id==='ad-budget'&&run){G.setAdBudget(run,Number(el.value));render();return;}if(!el.matches('select[data-member]')||!run)return;const ok=G.assignMember(run,el.dataset.member,el.value);if(!ok)toast('这个岗位暂时不能分配。');render();});
  document.addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();const name=new FormData(e.target).get('heroName');if(!G.renameHero(meta,name))toast('请先暂停或结算项目再修改称呼。');render();return;}if(e.target.id!=='setup-form')return;e.preventDefault();if(!updateProjectNameValidation())return;const fd=new FormData(e.target);try{run=G.newRun({scale:setupScale,name:fd.get('name'),hard:fd.get('difficulty')==='hard',seed:fd.get('seed'),objective:fd.get('objective')},meta);}catch(err){$('setup-error').textContent=err.message;return;}view='game';tab='work';workModule='content';hiddenPrompt=false;close();render();window.scrollTo(0,0);});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;e.preventDefault();const a=b.dataset.action;
    if(a==='close'){hiddenPrompt=true;close();return;}
    if(a==='audio'){const st=audio.getState();audio.setSettings({muted:!(st.settings?.muted??st.muted)});audio.unlock();return;}
    if(a==='help'){help();return;}
    if(a==='setup'){setup(b.dataset.scale);return;}
    if(a==='setup-scale'){const form=$('setup-form'),name=form.elements.name.value,mode=form.elements.difficulty.value,objective=form.elements.objective.value,seed=form.elements.seed.value,old=G.SCALES.find(g=>g.id===setupScale).title;setup(b.dataset.scale);if(name&&name!==old)$('setup-form').elements.name.value=name;$('setup-form').elements.difficulty.value=mode;$('setup-form').elements.objective.value=objective;$('setup-form').elements.seed.value=seed;updateProjectNameValidation();return;}
    if(['home','nav','continue','career'].includes(a)){view=a==='nav'?b.dataset.view:a==='continue'?'game':a==='career'?'career':'home';close();hiddenPrompt=false;render();window.scrollTo(0,0);return;}
    if(a==='pause-project'){pauseCurrentProject();return;}
    if(a==='pause-setup'){const scale=b.dataset.scale;if(pauseCurrentProject())setup(scale);return;}
    if(a==='resume-project'){const resumed=G.resumeProject(meta,b.dataset.id,run);if(!resumed){toast('当前无法恢复这个项目。');return;}run=resumed;view='game';tab='work';workModule='content';hiddenPrompt=false;close();render();window.scrollTo(0,0);return;}
    if(a==='history-filter'){if(['all','active','paused','released','aborted'].includes(b.dataset.filter))historyFilter=b.dataset.filter;render();return;}
    if(a==='history-result'){const record=meta.history.find(r=>r.runId===b.dataset.id);if(record)result(record);return;}
    if(a==='result'){result();return;}
    if(a==='tab'){tab=b.dataset.tab;render();return;}
    if(a==='work-module'){selectWorkModule(b.dataset.module);return;}
    if(a==='train'){if(!G.train(meta,b.dataset.skill))toast('当前无法训练，请检查经验或先暂停项目。');render();return;}
    if(a==='career-hire'){if(!G.hirePartner(meta,b.dataset.id))toast('当前无法邀请，请检查资金或先结算项目。');render();return;}
    if(a==='career-dismiss'){const member=G.RECRUITS.find(r=>r.id===b.dataset.id);if(!member||meta.activeRunId)return;showDialog(dialogHeader('TEAM CHANGE','与'+esc(member.name)+'暂别？')+'<p class="dialog-desc">支付 ¥100，之后不再计算这位伙伴的工资。结识关系保留，后续可再次邀请。</p><div class="dialog-actions"><button data-action="close">继续同行</button><button data-action="confirm-career-dismiss" data-id="'+member.id+'">确认暂别 · ¥100</button></div>','career-dismiss');return;}
    if(a==='confirm-career-dismiss'){G.dismissPartner(meta,b.dataset.id);close();render();return;}
    if(a==='reset-career'){if(meta.activeRunId)return;showDialog(dialogHeader('A FRESH CAREER','重新开始整个生涯？')+'<p class="dialog-desc">资金恢复到 ¥7,600，主角五项能力恢复为 100%。伙伴、结识名单、经验和作品履历都会清空。</p><div class="dialog-actions"><button data-action="close">保留当前生涯</button><button data-action="confirm-reset-career">确认重新开始</button></div>','reset-career');return;}
    if(a==='confirm-reset-career'){if(meta.activeRunId)return;meta=G.emptyMeta();run=null;close();view='career';render();return;}
    if(!run||run.over)return;
    if(a==='prompt'){if(run.pendingEvent)showEvent();return;}
    if(a==='event'){if(G.resolveEvent(run,Number(b.dataset.index))){close();hiddenPrompt=false;render();}return;}
    if(a==='release'){release();return;}
    if(a==='dismiss'){const m=run.team.find(m=>m.id===b.dataset.id);if(!m||m.kind!=='partner'||busy())return;showDialog(dialogHeader('UNTIL NEXT TIME','与'+esc(m.name)+'暂别？')+`<p class="dialog-desc">支付 ¥100 安置费，之后不再计入${esc(m.name)}的周薪。本项目内不能再次邀请；结识关系会保留到后续关卡。此操作占用本周管理行动。</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">继续同行</button><button data-action="downsize" data-id="${m.id}">确认暂别 · ¥100</button></div>`,'dismiss');return;}
    if(a==='confirm-release'){finish(true);return;}
    if(a==='confirm-abort'){finish(false);return;}
    if(a==='abort'){showDialog(dialogHeader('PAUSE THIS PROJECT','结束这个项目？')+`<p class="dialog-desc">当前作品不会发售。已完成的 ${run.milestones.length} 个里程碑可保留 ${Math.min(30,run.milestones.length*8)} 点经验，已经花掉的资金不返还；剩余资金、主角能力和已加入的伙伴会带入下一关。</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">继续开发</button><button data-action="confirm-abort">结束并结算</button></div>`,'abort');return;}
    if(busy()){toast('请先完成当前随机事件选择。');return;}
    if(a==='advance'){const warnings=G.softCapWarnings(run);if(warnings.length)showWorkCapWarning(warnings);else advanceWeek();return;}
    if(a==='confirm-advance'){if(b.dataset.run!==run.id||Number(b.dataset.week)!==run.week){close();toast('项目状态已变化，请重新检查分工。');return;}close();advanceWeek();return;}
    let ok=true;

    if(a==='budget')ok=G.setAdBudget(run,Number(b.dataset.value));

    if(a==='freeze')ok=G.freeze(run);
    if(a==='pace'){run.pace=b.dataset.pace;}
    if(a==='assign')ok=G.assign(run,b.dataset.job,Number(b.dataset.delta));
    if(a==='hire')ok=G.hire(run,b.dataset.id);
    if(a==='downsize'){ok=G.downsize(run,b.dataset.id);close();}
    if(a==='feature')ok=G.feature(run,b.dataset.id);
    if(a==='cut')ok=G.cutFeature(run,b.dataset.id);
    if(a==='funding'){showDialog(dialogHeader('PUBLISHING PARTNERSHIP','给开发，多一点余地。')+`<p class="dialog-desc">发行商愿意预付 ¥2,200，换取本作发售收入的 22%。这笔资金不增加品质，也不降低完成度推进所需投入，每个项目只能签一次。</p><p class="quality-note">发售收入预估将自动按扣除分成后的数值显示。</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">先不合作</button><button class="btn-primary" data-action="confirm-funding">接受合作，获得 ¥2,200</button></div>`,'funding');return;}
    if(a==='confirm-funding'){ok=G.funding(run);close();}
    if(!ok&&a!=='advance')toast('当前条件不满足，操作未执行。');render();
  });
  dialog.addEventListener('cancel',()=>{hiddenPrompt=true;dialogKind='';});
  document.addEventListener('keydown',e=>{const b=e.target.closest('[data-action="work-module"]');if(!b||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=G.GROUPS.findIndex(g=>g.id===b.dataset.module),n=G.GROUPS.length,next=e.key==='Home'?0:e.key==='End'?n-1:(i+(e.key==='ArrowRight'?1:-1)+n)%n;selectWorkModule(G.GROUPS[next].id);$('work-tab-'+G.GROUPS[next].id)?.scrollIntoView({block:'nearest',inline:'nearest'});});
  document.addEventListener('keydown',e=>{if(e.key===' '&&view==='game'&&!dialog.open&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();document.querySelector('.next-week')?.click();}});
  // Terminating a project is always visible from its history tab, including an exhausted budget.
  const originalLogs=logs;logs=function(){return originalLogs()+(!run.over?'<div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn-ghost btn-small" data-action="abort">终止当前项目并结算</button></div>':'');};
  if(run&&run.over){meta=G.settle(meta,run);}render();
})();

</script>
</body>
</html>
