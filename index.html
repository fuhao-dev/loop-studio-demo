    const managed=G.publisherManaged(s,j.id),skill=G.taskSkill(m,j.id),cap=G.softCap(s,j.id),completion=G.progress(s,j.id),estimate=skill&&!managed?G.assignmentEstimate(s,m.id,j.id):null;
    const signed=n=>(Math.abs(n)<.05?'0':(n>0?'+':'−')+Math.abs(n).toFixed(1))+'%';
    const atCap=j.group!=='release'&&completion>=cap-1e-9;
    const predicted=managed?'发行商托管':estimate?'预计 '+signed(estimate.percent):skill?'暂不预估':'不会';
    const ceiling=j.group==='release'?'无软上限':'软上限 '+Math.round(cap*100)+'%';
    const text=(managed?'发行商托管 · ':'')+(j.id==='acquisition'&&s.adBudget===0?'⚠ 无预算 · ':'')+(atCap?(cap<1?'⚠ 已到软上限 · ':'⚠ 已完成 · '):'')+j.name+' · 完成 '+(completion*100).toFixed(1)+'% / '+ceiling+' · '+predicted+' · 能力 '+skill+'%';
    return `<option value="${j.id}"${m.job===j.id?' selected':''}${skill===0||managed?' disabled':''}>${text}</option>`;
  }
  function assignment(s,m,active){return `<label class="person-assignment"><span>本周负责</span><select data-member="${m.id}" aria-label="${esc(m.name)}本周岗位"${disabled(active)}><option value="idle"${m.job==='idle'?' selected':''}>待命（仍计工资）</option>${G.GROUPS.map(g=>`<optgroup label="${g.name}">${G.JOBS.filter(j=>j.group===g.id).map(j=>workOption(s,m,j)).join('')}</optgroup>`).join('')}</select></label>`;}

  function productionEstimate(s,m,plan){
    if(m.job==='idle')return '<span class="state-chip">待命 · 产能 0 · 仍计工资</span>';
    const warning=G.softCapWarnings(s).find(w=>w.job===m.job),base='基础产能 '+G.memberOutput(s,m.id).toFixed(1)+' 点';
    const noBudget=m.job==='acquisition'&&s.adBudget===0,alerts=[];
    if(noBudget)alerts.push('预算 ¥0 · 本周买量无进度');
    if(warning)alerts.push((warning.full?'完成度已满':'已到软上限 '+warning.cap+'%')+(warning.ongoing?' · '+warning.ongoing:''));
    const alertHtml=alerts.map(t=>'<span class="work-cap-warning">⚠ '+t+'</span>').join('');
    if(!plan)return '<div class="production-pair"><small>'+base+'</small><span>'+(s.over?'项目已结束':s.paused?'项目已暂停':'处理事件后更新预估')+'</span></div>'+alertHtml;
    const signed=n=>(Math.abs(n)<.05?'0':(n>0?'+':'−')+Math.abs(n).toFixed(1))+'%';
    const range=plan.ranges[m.job],low=range.low/s.req[m.job]*100,high=range.high/s.req[m.job]*100,amount=Math.abs(high-low)<.01?signed(high):signed(low)+' ～ '+signed(high);
    const limit=G.workLimit(s,m.job),ceiling=s.req[m.job]*G.softCap(s,m.job),notes=[];
    if(limit<ceiling-.01)notes.push(m.job==='review'?'等待资料准备完成':'受上游完成度限制');
    if(s.work[m.job]>=ceiling-.01)notes.push(G.softCap(s,m.job)<1?'已到软上限':'完成度已满');
    else if(ceiling-s.work[m.job]<plan.production[m.job])notes.push(G.softCap(s,m.job)<1?'受软上限限制':'接近 100%');
    const conditions=notes.slice();
    if(s.hard)notes.push('满效率预估，不含真实模式减速、返工与牵连');
    if(m.job!==m.lastJob)notes.push('转岗磨合 −'+Math.round(20*G.mods(s).ramp)+'%');
    if(G.reputationProfile(s).speedBonus)notes.push('工作室名誉加速 +'+Math.round(G.reputationProfile(s).speedBonus*100)+'%');
    const dependency=G.workDependency(s,m.job);if(dependency)notes.push('上游依赖：'+dependency.sources.map(source=>source.name+' '+(source.value*100).toFixed(1)+'%').join(' / ')+'；上游允许上限 '+(dependency.cap*100).toFixed(1)+'%');
    if(noBudget)notes.push('买量预算为 ¥0，不扣投放费，不产生买量进度；团队工资照付。');
    const shared=s.team.filter(p=>p.job===m.job).length>1?'同岗合计':'';
    return `<div class="production-pair"><div class="production-estimate" aria-label="本周岗位预计 ${amount}"><small>${s.hard?'满效率岗位预计':'本周岗位预计'}</small><b>${amount}</b></div><div class="production-base"><small>${base}</small>${shared?'<span class="state-chip">'+shared+'</span>':''}${s.hard?'<span class="state-chip">满效率</span>':''}</div></div>${alertHtml}${conditions.length?'<div class="production-conditions">'+conditions.map(t=>'<span class="state-chip">'+t+'</span>').join('')+'</div>':''}<details class="production-breakdown"><summary>产出依据</summary><ul class="production-note">${(notes.length?notes:['已计依赖与上限']).map(t=>'<li>'+t+'</li>').join('')}</ul></details>`;
  }

  function memberCard(s,m,active,candidate=false,plan=s?G.progressEstimate(s):null,context={}){
    const career=!!context.meta,known=(career?context.meta.knownPartners:s?.knownPartners||[]).includes(m.id),departed=!!s?.departed.includes(m.id),rank=G.personRank(m),kind=candidate?(known?'候选伙伴':'待结识'):m.kind==='hero'?'主角':m.kind==='companion'?'初始搭档':'团队伙伴';
    const growth=G.reputationProfile(career?context.meta:s),full=(career?context.meta.partners.length+2:s.team.length)>=growth.teamCap;
    const canHire=!full&&active&&known&&!departed&&(career?context.meta.wallet>=180:!s.managed&&s.money>=180),label=full&&known?'团队已满 · 上限 '+growth.teamCap+' 人':!known?G.recruitUnlockText(m):departed?'本项目已暂别，下个项目可再邀请':!active?(career?'暂停当前项目后可在局外邀请':'恢复项目并处理事件后可邀请'):!career&&s.managed?'本周管理行动已使用':(career?context.meta.wallet:s.money)<180?'资金不足，需要 ¥180':'邀请'+m.name+'入组 · ¥180';
    return '<article class="person-card '+(m.id==='ace'?'person-ai ':'')+(rank?'ranked-card rarity-'+rank.id:'')+(candidate&&!known?' unacquainted':'')+'" data-person="'+m.id+'"'+(rank?' data-rarity="'+rank.id+'"':'')+' style="--person-color:'+m.color+';--rank-color:'+(rank?.color||m.color)+'">'+rankBadge(m)+'<div class="person-head">'+portrait(m)+'<div><span class="person-kind">'+kind+'</span><h3>'+esc(m.name)+'</h3><p>'+esc(m.title)+'</p></div></div><p class="person-bio">'+esc(m.bio)+'</p>'+abilities(m)+'<blockquote>“'+esc(m.quote)+'”</blockquote><div class="person-salary">基础周薪 <b>¥'+m.salary+'</b>'+(candidate?'<span>入组准备 ¥180</span>':'<div class="person-production">'+productionEstimate(s,m,plan)+'</div>')+'</div>'+(candidate?'<p class="recruit-requirement">'+(known?'已结识 · 跨项目保留':G.recruitUnlockText(m))+'</p><button class="btn-teal person-join" data-action="'+(career?'career-hire':'hire')+'" data-id="'+m.id+'"'+disabled(canHire)+'>'+esc(label)+'</button>':assignment(s,m,active))+(!candidate&&m.kind==='partner'?'<button class="person-dismiss" data-action="dismiss" data-id="'+m.id+'"'+disabled(active&&!s.managed&&s.money>=100)+'>与'+esc(m.name)+'暂别 · ¥100</button>':'')+'</article>';
  }
  function recruitmentBoard(s,active,filter='all',context={}){
    const joined=context.meta?context.meta.partners:s.team.filter(m=>m.kind==='partner').map(m=>m.id),known=context.meta?context.meta.knownPartners:s.knownPartners,remaining=G.RECRUITS.filter(r=>!joined.includes(r.id)).sort((a,b)=>G.PERSON_RANKS.findIndex(r=>r.id===G.personRank(a).id)-G.PERSON_RANKS.findIndex(r=>r.id===G.personRank(b).id)),shown=remaining.filter(r=>filter==='all'||G.personRank(r).id===filter),ready=remaining.filter(r=>known.includes(r.id)&&!s?.departed.includes(r.id)).length;
    return '<section class="recruitment-board" aria-label="候选伙伴图鉴"><div class="section-heading"><div><h2>候选伙伴 <span class="pill gold">'+G.RECRUITS.length+' 人</span></h2><small>已入组 '+joined.length+' · 已结识待邀请 '+ready+' · 团队 '+(joined.length+2)+'／'+G.reputationProfile(context.meta||s).teamCap+' 人</small></div></div><div class="recruit-filters" role="group" aria-label="按人物评级筛选">'+[{id:'all',color:'#b7c5cb'},...G.PERSON_RANKS].map(r=>'<button class="recruit-filter'+(filter===r.id?' selected':'')+'" style="--rank-color:'+r.color+'" aria-pressed="'+(filter===r.id)+'" data-action="recruit-filter" data-rank="'+r.id+'">'+(r.id==='all'?'全部':r.id)+' <span>'+(r.id==='all'?remaining.length:remaining.filter(p=>G.personRank(p).id===r.id).length)+'</span></button>').join('')+'</div><p class="rank-explanation">能力分＝最高能力×60%＋次高×25%＋其余三项平均×15%。主角不评级；龙娘为特殊 EX。未结识的伙伴可预览能力，达到名誉要求后即可邀请；名誉解锁团队上限。</p>'+(shown.length?'<div class="people-grid candidate-grid">'+shown.map(m=>memberCard(s,m,active,true,null,context)).join('')+'</div>':'<div class="panel people-empty"><p>这一档的伙伴已全部入组。</p></div>')+'</section>';
  }
  function autoAssignmentControls(active){return '<div class="crew-actions"><button type="button" class="btn-small btn-teal" data-action="auto-assign"'+disabled(active)+'>自动分配</button></div>';}
  function autoAssignmentHelp(){return '<details class="auto-assignment-help"><summary>自动分配怎么算？</summary><p>以本周 13 项工作平均完成度的预估增量最大为目标，计入人物能力、转岗磨合、同岗协作、软上限、刚性上限和上游依赖。遵守现有买量预算与可支付资金，排除不会的工作和发行商托管岗位；同收益优先保留现有分工。10 人及以内计算全局最优；更大的团队从现有分工及两组新分工出发，搜索岗位调换与人员交换，不保证全局最优。真实模式同样使用满效率预估。完成度之外的偿债与未来周收益可结合策略手动安排。</p></details>';}
  function strip(s,active,plan=G.progressEstimate(s)){return `<section class="crew-section"><div class="section-heading"><div><h2>一起做游戏的人</h2><small>能力决定产能 · 每人每周专注一岗</small></div><div class="crew-actions">${autoAssignmentControls(active)}<button class="btn-small btn-ghost" data-action="tab" data-tab="team">查看人物卡 ↗</button></div></div><p class="crew-legend">选项：当前完成度 / 软上限 · 选岗后团队合计预估 · 人物能力。预估按满效率计算，计入上游依赖、上限、转岗磨合与同岗协作。</p>${autoAssignmentHelp()}<div class="crew-strip">${s.team.map(m=>`<article class="crew-mini" style="--person-color:${m.color}"><div class="crew-mini-head">${portrait(m)}<div><strong>${esc(m.name)} ${rankBadge(m,true)}<small>${m.kind==='hero'?'主角':m.id==='ace'?'龙娘搭档':''}</small></strong><p>${summary(m)}</p></div></div>${assignment(s,m,active)}<div class="contribution">${productionEstimate(s,m,plan)}</div></article>`).join('')}</div></section>`;}
  function roster(s,active,plan=G.progressEstimate(s),filter='all'){return '<div class="section-heading"><h2>本周团队分工 · '+s.team.length+' 人</h2>'+autoAssignmentControls(active)+'</div>'+autoAssignmentHelp()+'<p class="legend">100% 为标准能力；擅长 ≥130%，不会的岗位不能分配。天才程序员每项 145%，每周仍只负责一岗。同岗最有效成员发挥全产能，其余按协作效率折算；转岗磨合按每个人上周的实际岗位计算。团队上限由名誉逐步解锁，工资与维护随团队增加。</p><p class="crew-legend">岗位预估为选岗后的团队合计，按满效率、依赖与上限计算；详细依据可展开查看。</p><div class="people-grid">'+s.team.map(m=>memberCard(s,m,active,false,plan)).join('')+'</div>'+recruitmentBoard(s,active,filter)+'<p class="legend" style="margin-top:18px">邀请和暂别占用本周管理行动；邀请不推进时间，新伙伴首周需要磨合。整个团队会带入下一关；主角与天才程序员始终留队。伙伴暂别后本项目不能再次邀请，但结识关系跨关保留。</p>';}
  function voice(s,event){const v=G.teamVoice(s,event),m=s.team.find(m=>m.id===v.id);return `<div class="team-voice">${portrait(m)}<div><strong>${esc(v.name)}</strong><p>${esc(v.text)}</p></div></div>`;}
  window.StudioPeople={portrait,rankBadge,recruitmentBoard,abilities,summary,assignment,productionEstimate,memberCard,strip,roster,voice};
})();

</script>
<script>
(function(){
  'use strict';
  const G=window.StudioGame, P=window.StudioPeople, $=id=>document.getElementById(id);
  const SAVE='loop_studio_career_v14';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const yen=n=>{const value=Math.round(n);return (value<0?'−':'')+'¥'+Math.abs(value).toLocaleString('zh-CN');};
  function incomeRange(s,kind='revenue'){
    const v=G.incomeView(s),r=v[kind];if(!r)return '?????';
    return (v.level<5?'约 ':'')+(kind==='adRate'?r.low+'%—'+r.high+'%':r.low===r.high?yen(r.low):yen(r.low)+'—'+yen(r.high));
  }
  function incomeDisclosure(s){const v=G.incomeView(s);return `<div class="income-disclosure"><span>${v.label} · ${v.level} / 5</span><small>${v.next}</small></div>`;}
  const pct=(n,d)=>Math.max(0,Math.min(100,Math.floor(n/d*100)));
  let run=null,meta=G.emptyMeta(),view='home',tab='work',workModule='content',historyFilter='all',recruitFilter='all',hiddenPrompt=false,setupScale='micro',toastTimer,storageOK=true,guideOpen=false;
  try{const snapshot=JSON.parse(localStorage.getItem(SAVE)||'null');if(G.validateSnapshot(snapshot)){meta=snapshot.meta;run=snapshot.run;}}catch{}

  const audio=window.DSHAudio.create(window);audio.init(updateAudio);
  function updateAudio(){const a=audio.getState();const muted=a.settings?.muted??a.muted;const b=$('audio-toggle');b.classList.toggle('on',!muted);b.setAttribute('aria-label',muted?'开启声音':'关闭声音');b.title=muted?'开启声音':'关闭声音';}
  function save(){G.syncCareer(meta,run);try{localStorage.setItem(SAVE,JSON.stringify({meta,run}));}catch{if(storageOK){storageOK=false;toast('浏览器未允许保存，当前进度仅在本次打开期间保留。');}}}
  function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.add('toast');toastTimer=setTimeout(()=>$('toast').classList.remove('toast'),3200);}
  function disabled(ok){return ok?'':' disabled';}
  function busy(){return !run||run.over||run.pendingEvent||run.eventResult?.unread;}
  function bar(value,max,color){return `<div class="progress" style="--bar:${color||'var(--teal)'}"><span style="width:${pct(value,max)}%"></span></div>`;}
  function metricHelpButton(id){const name=id==='morale'?'士气':'技术债';return `<button type="button" class="metric-help-trigger" data-metric-help="${id}" aria-label="查看${name}说明" aria-haspopup="dialog" aria-expanded="false" aria-controls="metric-help">?</button>`;}
  function metricHelpContent(s,id){
    const morale=id==='morale',name=morale?'士气':'技术债';
    const body=morale?`<div class="metric-help-current">当前 ${Math.round(s.morale)} / ${G.reputationProfile(s).moraleCap}<span>全岗位产出系数 ×${((.65+s.morale/285)*100).toFixed(1)}%</span></div>
      <p>士气影响所有岗位的每周产出，与能力、节奏等效果相乘。</p><ul><li>正常开发：每周士气 +1。</li><li>休整：当周产出 ×70%，士气 +12。</li><li>赶工：当周产出 ×135%，士气 −10。</li><li>士气低于 65，疲劳类事件会进入随机池。</li></ul><p class="metric-help-foot">士气范围 25—${G.reputationProfile(s).moraleCap}，每个新项目从 90 开始；名誉解锁提高上限后仍需自行恢复。产出系数 = 0.65 + 士气 ÷ 285。</p>`:
      `<div class="metric-help-current">当前 ${s.debt.toFixed(1)} 点<span>程序产出系数 ×${(Math.max(.6,1-s.debt*.01)*100).toFixed(1)}%</span></div>
      <div class="metric-help-effects"><span>每周额外基础维护 <b>+${yen(s.debt*2)}</b></span><span>完善度真实分数 <b>−${(s.debt*.18).toFixed(2)}</b></span></div>
      <p>每点技术债使程序岗位效率降低 1%，最低为 60%；影响开发进度和系统协作。每点另增加约 ¥2/周维护费。</p><ul><li>安排系统协作可持续偿债，完成度已满时仍有效。</li><li>开发与赶工会增加技术债；赶工额外 +2/周。</li><li>部分事件也可偿还技术债。</li></ul><p class="metric-help-foot">每个新项目从 0 开始。系统协作推进完成度的同时持续偿债。</p>`;
    return `<header><h2 id="metric-help-title">${name}说明</h2><button type="button" class="metric-help-close" aria-label="关闭数值说明">×</button></header>${body}`;
  }
  function positionMetricHelp(){
    if(!metricTrigger||metricPopup.hidden)return;
    const r=metricTrigger.getBoundingClientRect(),w=metricPopup.offsetWidth,h=metricPopup.offsetHeight,pad=12;
    metricPopup.style.left=Math.max(pad,Math.min(innerWidth-w-pad,r.left+r.width/2-w/2))+'px';
    const below=r.bottom+8,above=r.top-h-8;
    metricPopup.style.top=Math.max(pad,Math.min(innerHeight-h-pad,below+h<=innerHeight-pad?below:above))+'px';
  }
  function hideMetricHelp(restoreFocus=false){
    clearTimeout(metricHideTimer);const trigger=metricTrigger;
    if(trigger)trigger.setAttribute('aria-expanded','false');
    metricTrigger=null;metricPinned=false;metricPopup.hidden=true;
    if(restoreFocus&&trigger?.isConnected){suppressMetricFocus=true;trigger.focus();suppressMetricFocus=false;}
  }
  function showMetricHelp(trigger,pinned=false){
    const id=trigger.dataset.metricHelp;if(!run||!['morale','debt'].includes(id))return;
    clearTimeout(metricHideTimer);if(metricTrigger&&metricTrigger!==trigger)metricTrigger.setAttribute('aria-expanded','false');
    metricTrigger=trigger;metricPinned=pinned;metricPopup.innerHTML=metricHelpContent(run,id);metricPopup.hidden=false;
    trigger.setAttribute('aria-expanded','true');positionMetricHelp();
  }
  function scheduleMetricHide(){clearTimeout(metricHideTimer);metricHideTimer=setTimeout(()=>{if(!metricPinned)hideMetricHelp();},160);}

  function title(eye,name,sub,right=''){return `<div class="title-row"><div><div class="eyebrow">${eye}</div><h1>${name}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${right}</div>`;}
  function officeSVG(){
    const people=run?G.teamSize(run):2;
    const desks=[{x:156,y:170,c:'#92bca8'},{x:268,y:170,c:'#a6afe0'},{x:213,y:239,c:'#d8bb80'},{x:325,y:239,c:'#d8a991'}];

    html+=`<details class="workbench-guide" id="workbench-guide"${guideOpen?' open':''}><summary>制作人目标与评级说明<span>展开查看 ↗</span></summary>${strategyPanel(s,p)}</details>`;

  function strategyPanel(s,p){const o=G.objectiveStatus(s,s.over?s.result:undefined),f=G.forecast(s),visible=G.incomeView(s).visible;return `<section class="strategy-panel"><div class="strategy-title"><div><span class="eyebrow">BUILD · LEARN · DECIDE</span><h2>${o.name} <span class="pill dim">${s.over?s.result.objectiveOK?'已达成':'未达成':visible&&o.ok?'有望达成':'开发中'}</span></h2><p>${s.objective==='acclaim'?'综合真实评级达到 A-':'发售后项目结余至少 ¥1,200'} · 达成额外 +40 EXP</p></div><div class="objective-value gold">${s.over?s.objective==='acclaim'?s.result.released?s.result.rating:'—':yen(s.result.profit):s.objective==='acclaim'?esc(f.rating.text):incomeRange(s,'profit')}<small>${s.over?'实际结算':visible?'基于当前认知，未计未来成本':'推进宣传，逐步揭示预计结余'}</small></div></div><div class="strategy-flow"><span>推进工作</span><b>→</b><span>积累真实品质</span><b>→</b><span>宣传验证认知</span><b>→</b><span>决定投放与发售</span></div><p class="quality-note">????? 表示完全未知；例如 B???? 是可能偏离真实值的初步判断。问号越少，误差越小。收入区间也随宣传逐步揭示；宣传改变认知，不会直接提高作品品质。</p></section>`;}
  function job(s,j,p,active){
    const assigned=s.team.filter(m=>m.job===j.id),completion=G.progress(s,j.id),cap=G.softCap(s,j.id),phase=G.workPhase(s,j.id),listing=j.group==='release',done=completion>=1;
    const atCap=!listing&&cap<1&&completion>=cap-.0001,dependency=G.workDependency(s,j.id),upstream=G.workLimit(s,j.id)<s.req[j.id]*cap-.01&&G.workLimit(s,j.id)<=s.work[j.id]+.01;
    const pp=n=>(Math.abs(n)<.05?'0':(n>0?'+':'−')+Math.abs(n).toFixed(1))+'%',range=p?.ranges[j.id],low=range?range.low/s.req[j.id]*100:0,high=range?range.high/s.req[j.id]*100:0;
    const forecast=!p?(s.over?'已结算':s.paused?'已暂停':'待事件'):Math.abs(high-low)<.01?pp(high):pp(low)+' ～ '+pp(high),last=s.history.at(-1)?.gains?.[j.id];

      <div class="progress completion-bar" style="--bar:${j.color};--soft:${cap*100}%" aria-label="${j.name}完成度 ${(completion*100).toFixed(1)}%，${listing?'无软上限':'软上限 '+Math.round(cap*100)+'%'}"><span style="width:${completion*100}%"></span>${!listing&&cap<1?'<i class="soft-limit" aria-hidden="true"></i>':''}</div>

      <p class="detail-foot">基础产能未计阶段与上限；${s.hard?'以上为满效率预估，未计真实模式的阶段减速、随机返工与牵连；实际变化可能不同。':'预计已计入上游依赖与完成度上限。'}</p>

      <div class="job-members">${G.publisherManaged(s,j.id)?'发行团队 · 每周 '+G.PUBLISHER_WEEKLY_WORK+' 点基础工作':assigned.map(m=>`<span style="color:${m.color}">${esc(m.name)} · ${G.taskSkill(m,j.id)}%${m.job!==m.lastJob?' · 磨合中':''}</span>`).join(' / ')||'未安排伙伴'}</div>

  function workGroup(s,g,p,active){const v=g.id==='release'?null:G.ratingView(s,g.id),list=G.JOBS.filter(j=>j.group===g.id);return `<section class="panel work-group" id="group-${g.id}" style="--group-color:${g.color}"><header class="work-group-head"><div><span class="eyebrow">${String(G.GROUPS.indexOf(g)+1).padStart(2,'0')} / ${g.id==='release'?'必须完成':'可自主取舍'}</span><h2>${g.icon} ${g.name}</h2><p class="group-total">总完成度 <b>${(G.groupProgress(s,g.id)*100).toFixed(1)}%</b> · ${list.length} 项工作</p></div><div class="group-verdict"><small>${g.rating}</small><strong>${v?esc(v.text):G.complete(s)?'可上架':'未就绪'}</strong>${v?`<span>${v.exact?'真实评级':v.level?'范围 '+v.lowGrade+'—'+v.highGrade:'等待反馈'}</span>`:`<span>上架总进度 ${Math.floor(G.groupProgress(s,'release')*100)}%</span>`}</div></header>${s.publisher&&['promotion','release'].includes(g.id)?`<p class="group-note">发行商托管 · 每项每周 ${G.publisherWork(s)} 点基础工作，不占用团队人物；仍遵守上限、依赖与模式规则。</p>`:''}${list.map(j=>job(s,j,p,active)).join('')}${g.id==='promotion'?marketing(s,active):g.id==='release'?'<p class="group-note">资料准备 100% 后才能推进审核。上架资格确定，不受评级随机值影响。</p>':''}</section>`;}
  function marketing(s,active){const a=G.adProjection(s),level=G.revealLevel(s),buying=G.buyingStatus(s),iv=G.incomeView(s),signed=!!s.publisher;return `<div class="marketing-controls"><div class="reveal-progress"><strong>评级揭示 ${level} / 5</strong><span>宣传 >0 / 25 / 50 / 75 / 100% 逐步揭示评级与收入</span></div><p class="quality-note">${signed?'发行团队自动推进宣发；买量由发行商决定预算并垫付，玩家无需安排人手。':'宣传和买量都不影响发售资格。买量需要安排伙伴并设置预算；未安排人手不扣投放费，¥0 暂停。'}</p><div class="buying-status ${buying.reason?'warning':''}">${buying.reason?'⚠ '+buying.reason+'；团队工资照付。':'本周预计投放 '+yen(buying.spend)+(signed?' · 发行商支付':' · 工作室支付')}</div>${signed?`<div class="publisher-budget" aria-label="发行商买量预算"><div><span>发行商决定 · 本周买量预算</span><strong>${yen(buying.budget)}<small> / 周</small></strong></div><span class="pill">发行商控制</span><p>按项目规模与已揭示评级的中位预期逐周调整，玩家无法修改。未宣传按 B 档预期；C／D、B、A、S 档分别采用本规模的低档、常规、高档、最高预算。</p></div>`:`<label class="field"><span>本周买量预算 · ${G.SCALES.find(g=>g.id===s.scale).name}</span><select id="ad-budget" aria-label="本周买量预算"${disabled(active)}>${G.adBudgetOptions(s).map(n=>`<option value="${n}"${s.adBudget===n?' selected':''}>${n===0?'暂停买量 · ¥0':yen(n)+' / 周'}</option>`).join('')}</select><small>正预算 ${yen(G.adBudgetOptions(s)[1])}～${yen(G.adBudgetOptions(s).at(-1))}，最大为最小的 20 倍。</small></label>`}<div class="ad-ledger"><div><span>累计买量投入</span><b>${yen(a.spend)}</b></div>${signed?`<div><span>工作室自投 / 发行商垫付</span><b>${yen(a.studioSpend)} / ${yen(a.publisherSpend)}</b></div><div><span>预计买量总回款（分配前）</span><b>${incomeRange(s,'adTotal')}</b></div>`:''}<div><span>${signed?'预计工作室买量到账':'预计买量总回款'}</span><b>${incomeRange(s,'adGross')}</b></div><div><span>预计买量净回款${signed?'（工作室）':''}</span><b class="${iv.adNet&&iv.adNet.high<0?'red':''}">${incomeRange(s,'adNet')}</b></div><div><span>评级回款比例（分配前）</span><b>${incomeRange(s,'adRate')}</b></div></div>${incomeDisclosure(s)}<p class="quality-note">${signed?'工作室买量净回款 = 工作室买量到账 − 签约前自投成本。发行商投放先回收成本，再按合约比例分配正净利润；亏损不向工作室追偿。':'净回款 = 总回款 − 买量投入；累计投入已包含买量费用，不重复扣除。'} 回款在发售时结算，综合真实评级按内容 40% /   function projectEntries(){const live=[...(run&&!run.over&&meta.activeRunId===run.id?[run]:[]),...meta.pausedProjects].map(s=>({id:s.id,stage:s.stage,name:s.name,scale:s.scale,hard:s.hard,status:s.paused?'paused':'active',weeks:s.week-1,cost:s.spent,revenue:null,profit:null,rating:null,team:s.team,totalCompletion:G.JOBS.reduce((n,j)=>n+G.progress(s,j.id),0)/G.JOBS.length*100,progress:Object.fromEntries(G.GROUPS.map(g=>[g.id,G.groupProgress(s,g.id)*100]))}));return [...live,...meta.history.map(r=>({...r,id:r.runId,status:r.released?'released':'aborted'}))].sort((a,b)=>b.stage-a.stage);}

btn-small" data-action="history-result" data-id="${e.id}">查看结算报告</button>`}${['active','paused'].includes(e.status)?`<button class="btn-small btn-danger" data-action="end-project" data-id="${e.id}">结束项目</button>`:''}</div></div><div class="project-record-stats"><div><small>已开发</small><b>${e.weeks} 周</b></div><div><small>开发总完成度</small><b>${e.totalCompletion.toFixed(1)}%</b></div><div><small>累计投入</small><b>${yen(e.cost)}</b></div><div><small>${e.status==='aborted'?'结束回收':'发售收入'}</small><b>${e.status==='aborted'?yen(e.recovery||0):e.revenue===null?'未发售':yen(e.revenue)}</b>${e.status==='aborted'&&e.recoveryRate!==null?`<small>回收比例 ${Math.round(e.recoveryRate*100)}%</small>`:''}</div><div><small>项目盈亏</small><b class="${e.profit===null?'':e.profit>=0?'teal':'red'}">${e.profit===null?'待结算':yen(e.profit)}</b></div></div><details class="history-details"><summary>各模块进度与制作团队</summary><div class="history-progress">${G.GROUPS.map(g=>`<div><span>${g.rating}</span><b>${e.progress[g.id].toFixed(1)}%</b>${bar(e.progress[g.id],100,g.color)}</div>`).join('')}</div><p>制作团队：${e.team.map(m=>esc(m.name)).join('、')}</p>${e.status==='released'?'<p>仅上架两项为发售硬条件，其他模块可以未满进度。</p>':''}</details></article>`).join(''):`<section class="panel empty"><h2>${entries.length?'这个状态下还没有作品。':'你的第一款作品，从这里开始。'}</h2><p>${entries.length?'切换筛选可以查看其他项目。':'立项后，这里会保留每个项目的开发与发售情况。'}</p></section>`}</div>`;}

  function confirmEndProject(id){

    const ready=G.complete(s),switching=s.paused&&meta.activeRunId&&meta.activeRunId!==id,choicePending=!!s.pendingEvent||!!s.eventResult?.unread,ending=G.terminationQuote(s,meta.wallet);

  const metricPopup=document.createElement('aside');metricPopup.id='metric-help';metricPopup.className='metric-help';metricPopup.hidden=true;

      if(signed)cells+=cell('发行商自然销售分成',yen(r.publisherOrganicRevenue));
    }else cells+=cell('结束项目回收','+'+yen(r.recovery||0),r.recoveryRate===null?'尚无工作室投入，无可回收资金':'工作室投入回收 '+Math.round(r.recoveryRate*100)+'% · 结果已保存','teal');
    cells+=cell('买量总回款（分配前）',yen(r.adGrossRevenue))+cell('工作室自投买量成本',yen(r.studioAdSpend));
    if(signed)cells+=cell('发行商垫付买量成本',yen(r.publisherAdSpend))+cell('发行商收回买量成本',yen(r.publisherAdRecovered))+cell('发行商买量利润分成',yen(r.publisherAdProfit))+cell('发行商承担买量亏损',yen(r.publisherAdLoss),'工作室无需补差');
    cells+=cell('工作室买量到账',yen(r.adRevenue))+cell('买量净回款（工作室）',yen(r.adNetRevenue),'工作室到账 − 工作室自投成本',r.adNetRevenue<0?'red':'teal')+cell('评级回款比例（分配前）',r.released?(r.adRate*100).toFixed(1)+'%':'未发售');
    if(!r.released&&signed)cells+=cell('退还签约资金','−'+yen(r.advanceRepaid),'合约预付款 '+yen(r.advanceDue))+cell('预付款未追回部分',yen(r.advanceWrittenOff),'余额不足部分不转为负债');
    if(r.released)cells+=cell('产品总销售额（分成前）',yen(r.grossProductSales))+cell('本作获得名誉','+'+r.earnedReputation,(signed?'合作发行 ×50% · ':'')+'累计 '+r.reputationAfter,'gold');
    cells+=cell('本次发售到账',yen(r.revenue),'工作室自然收入 + 工作室买量到账','teal');
    if(signed)cells+=cell('发行预付款（此前已到账）',yen(r.publisher.advance),'已包含在项目其他收入，不重复入账');
    cells+=cell('项目其他收入（含预付款）',yen(r.otherIncome))+cell('项目结余',yen(r.profit),'发售到账 + 回收 + 其他收入 − 投入 − 退还签约资金',r.profit>=0?'teal':'red')+cell('本次制作经验','+'+r.exp+' EXP')+cell('结算时生涯余额',yen(r.walletEnd));
    showDialog(dialogHeader('THE TRUTH BEHIND THE QUESTION MARKS',r.released?'「'+esc(r.name)+'」发售了。':'把经验，留给下一作。')+`<div class="result-grade">${r.released?r.rating:'—'}<small>${r.released?'综合真实评级':'项目已结束'}</small></div>${r.unlockedMilestones?.length?`<div class="release-reminder"><strong>本次解锁 ${r.unlockedMilestones.length} 项开发里程碑</strong><ul>${r.unlockedMilestones.map(n=>`<li>${n.threshold} 名誉 · ${esc(n.label)}</li>`).join('')}</ul><button class="btn-small" data-action="nav" data-view="milestones">查看全部里程碑</button></div>`:''}${r.ratings?`<div class="result-ratings">${G.GROUPS.filter(g=>g.id!=='release').map(g=>`<div><small>${g.rating}</small><strong>${r.ratings[g.id].grade}</strong></div>`).join('')}</div>`:''}<div class="result-grid">${cells}</div><p class="result-note">共同完成：${r.team.map(m=>esc(m.name)).join('、')}${signed?'、发行团队':''}<br>${r.objectiveOK?'✓ 制作人目标达成，额外 +40 EXP。':'本作未达成制作人目标，保留已获得的制作经验。'}<br>所有项目共用主角能力、全局团队和生涯资金。</p><div class="dialog-actions"><button data-action="nav" data-view="history" class="btn-ghost">查看开发历史</button><button data-action="${meta.activeRunId?'continue':'setup'}" class="btn-primary">${meta.activeRunId?'继续当前开发 →':'新项目 →'}</button></div>`,'result');
  }

  function release(){if(!G.canRelease(run))return;const f=G.forecast(run);showDialog(dialogHeader('READY TO SHIP','让玩家，给出最后的答案。')+`<p class="dialog-desc">资料准备和审核都已达到 100%，可以正式发售。其他工作无最低门槛，未完成部分会影响真实品质与收益。</p><div class="result-grid"><div><label>综合评级认知</label><strong>${esc(f.rating.text)}</strong></div><div><label>当前认知收入区间</label><strong>${incomeRange(run)}</strong></div><div><label>其中工作室买量到账</label><strong>${incomeRange(run,'adGross')}</strong></div><div><label>工作室买量净回款区间</label><strong>${incomeRange(run,'adNet')}</strong></div><div><label>累计投入</label><strong>${yen(run.spent)}</strong></div></div>${incomeDisclosure(run)}<p class="quality-note">发售会揭晓四项真实评级和实际收入。收入预估初始不可见，随宣传进度逐步解锁；未宣传也可以发售。自然收入先乘规模倍率 ×${f.rules.scaleMultiplier}，再随机乘 ×${f.rules.marketMin.toFixed(2)}～${f.rules.marketMax.toFixed(2)}。基础抽样约一半遇冷、一半走热，再按综合真实评级托底：B 档最低 ×0.50、A 档 ×1.00、S 档 ×2.00（含各档 +／−）；C／D 档最低 ×0.10。当前区间只采用已揭示信息能确认的保底，宣传无法消除市场波动。买量按真实评级和投入金额结算。${run.publisher?'已签发行商：自然销售按签约比例分成；签约后买量先回收发行商成本，再按合约比例分配正净利润，亏损由发行商承担。预付款此前已到账，不重复入账。正式发售获得销售名誉，合作发行名誉减半。':''}</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">继续开发</button><button data-action="confirm-release" class="btn-primary">正式发售 ↗</button></div>`,'release');}
  function help(){showDialog(dialogHeader('STRATEGY HANDBOOK','投入多少，知道多少，何时发售。')+`<div class="manual"><p><strong>四档规模：</strong>微型、小型、中型、大型分别需要 54.4、163.2、489.6、1468.8 标准人周工作量。100% 能力每周基础产出 10 点为 1 人周，立项需持有每标准人周 ¥100 的资金，不预扣款。相同人员与状态，每周产出相同；完成度 = 已完成工作 ÷ 总需求。因此同一周工作，在小项目推进更多完成度。规模影响全部 13 项工作和功能扩展；上架仍没有软上限，但也需要完成该规模的全部上架工作。各规模共用评级与买量回款规则，自然收入分别乘 1、3、9、27 倍，请用资金和团队支持更长的开发。</p><p><strong>工作室名誉：</strong>仅正式发售增加，名誉为分成前自然销售与买量总回款之和÷100，合作发行减半。永久累计，自动解锁编制、伙伴、士气、团队速度和新发行条款。终止签约项目时先结算回收，再退还预付款，余额不足扣至0。买量可持续投放。</p><p><strong>市场际遇：</strong>自然收入先乘规模倍率，再抽取 0.10～10.00 倍基础市场系数；综合真实评级 B 档保底 ×0.50、A 档 ×1.00、S 档 ×2.00（含各档 +／−），C／D 档保持 ×0.10。低于保底的抽样直接取保底，其余抽样不变。市场影响可以压过品质差距；相同运气下，提高品质仍能提高收入。宣传揭示评级，无法消除市场波动；成功发售后显示本次系数。买量继续按真实评级比例回款，不乘规模或市场系数。</p><p><strong>五类十三项：</strong>游戏内容（题材、玩法、子主题）；程序构架（开发进度、系统协作、测试）；商业化（广告变现、用户付费、IP衍生）；宣发推广（宣传、买量）；上架（资料准备、审核进度）。在人物卡为每人安排一项工作，专业能力决定产出。</p><p><strong>工作与评级不同：</strong>完成度代表当前成果，评级是目前完成度加上本项目固定的大范围随机值。同一完成度也可能是 B 或 S；继续完善可以提高基础值，刷新和反复查看不重掷。</p><p><strong>两种上限：</strong>除上架外，11 项完成度初始软上限 70%。一般事件解锁更高上限，不直接增减完成度；签约后的发行商建议也可直接协助推进指定工作，仍受上限与依赖约束；上限按项保存，每次一般提高 15%，最高为刚性上限 100%。提高上限后还需安排工作，才会提高评级基础。横线标记当前软上限。</p><p><strong>理想与真实：</strong>理想模式工作稳定推进。真实模式以周初完成度判定：低于 30% 正常；30% 至不足 50% 效率 65%；50% 至 70% 效率 35%，正向推进的 20% 会随机扣除另一项非上架工作的完成度；超过 70% 增减各 50%，幅度为基础产能的 20%—100%，预览不透露本次结果。上架始终正常推进，也不会被其他工作牵连。两种模式都使用生涯余额，工资规则相同。</p><p><strong>先获得认知：</strong>四类评级初始为 ?????，宣传进度越高，问号越少。B???? 是粗略判断，可能偏离很远；宣传 100% 揭示当前真实评级。收入区间初始也为 ?????；宣传开始后显示粗略区间，25%、50%、75%、100% 逐档提高金额精度，同时缩小评级造成的不确定性。100% 仍保留市场波动范围，发售后显示实际收入。作品继续开发时，评级也会变化，认知范围随之更新。上架状态始终明确。</p><p><strong>宣发是选择：</strong>宣传用于了解作品；买量用于投入资金换取未来回款。独立发行时，安排买量岗位并选择预算后每周扣费；正预算按规模放大，最大为最小的 20 倍，¥0 暂停；未安排人手或预算 ¥0 不扣费。签约发行商后由发行团队自动负责，发行商垫付买量。买量进度满后，继续安排仍会追加投放；发售前没有回款。</p><p><strong>投放与风险：</strong>综合真实评级按内容 40%、完善度 30%、商业化 20%、推广 10% 计算。分配前回款比例：D 档 15—40%，C 档 55—90%，B 档 105—140%，A 档 165—230%，S 档 270—380%。签约后，发行商从其投放回款中先收回成本，再按合约比例分配正净利润；亏损由发行商承担，工作室不补差。C、D 档一定亏损，B 档起有回本机会。</p><p><strong>上架是硬条件：</strong>资料准备 100% 后才可推进审核；审核也到 100% 即可发售。其他工作不强制满进度，但提前发售可能得到低评级和亏损。</p><p><strong>局外成长：</strong>主角五项初始能力均为 100%，关卡之间可用经验训练，每次 +5、最高 200%。开发直接扣生涯资金，发售收入到账后继承到下一关，不重新发启动金。伙伴与结识名单也跨关保留。项目完成度、软上限、技术债和士气在新项目重新开始。</p><p><strong>人物与成本：</strong>主角加天才程序员两人开局，25 名候选伙伴按 N、R、SR、SSR、UR 分级，主角无评级，龙娘为特殊 EX。12 名 N/R 伙伴初始结识，SR／SSR／UR 分别在名誉 40／205／485 结识；加入后跨关留队，团队上限由名誉解锁，工资和维护随人数增加。转到另一具体工作会磨合一周，即使同属一类；同岗第一人全额，其他人按 45% 协作产能计算。待命照付周薪。</p><p><strong>上游依赖：</strong>内容支持开发，开发支持系统协作和测试。系统协作持续偿债，测试推进测试完成度与完善度。工作详情显示依赖与上游允许的完成度上限。</p><p><strong>签约发行商：</strong>可选合作。预付款按规模与已揭示评级中位预期对应的基准自然收入乘合约预付比例（初始 60%，名誉最高提升至 100%）计算，四舍五入至百元，未宣传按中性预期报价；每作仅领取一次，正式发售无需归还；终止开发时在随机回收后退还，余额不足扣至 0。签约后宣传、买量、资料、审核每周各 20～36 点基础工作（由签约时名誉决定），不占用人物和工资，仍遵守模式、依赖与上限。买量预算由发行商按规模与已揭示评级的中位预期逐周决定，玩家不能修改；未宣传按 B 档预期。自然销售按签约比例分成；发行商垫付后续买量并承担亏损，回款先收回成本再按合约比例分配正净利润。签约前工作室自投回款全额归工作室，盈亏自负。结束项目先随机回收工作室投入，再退还签约预付款。</p><p><strong>开发里程碑：</strong>正式发售时，名誉增加（自然销售总额＋买量总回款）÷100；合作发行减半。按销售额计算，不受盈亏影响，预付款、事件、补助和终止回收均不计入。名誉永久累计不消耗，逐步解锁 4～24 人团队、SR／SSR／UR、士气上限、人物工作速度及更好的新合约；具体要求可查看开发里程碑。新合约锁定预付款比例、工作室分成与托管速度，之后升级不会追溯修改。基础维护费＝90＋技术债×2＋超出 4 人的人数²×4。</p><p><strong>暂停与切换：</strong>同一时间只推进一个项目。暂停保留进度、分工、事件与随机结果，不发经验、不产生开发周成本；恢复同步共用资金、全局团队和能力。通过开发历史查看、恢复或切换项目，新立项仍需满足资金门槛。</p><p><strong>结束与补助：</strong>可从开发现场或开发历史结束正在开发或暂停的项目，结束后不能恢复。按累计投入随机回收 10%～50%，确认结束时仅抽取一次，资金和里程碑经验入账，记录保留。没有投入则回收为零，不抽随机比例；回收资金单列，不算发售收入，计入项目结余。待所有未完成项目（含暂停项目）均发售或结束后，若生涯余额低于 ¥5,440，可领取补助补足至 ¥7,600，保留成长和履历；暂停不能领取。</p><p><strong>随机事件：</strong>保留原事件，加入日常小插曲、选择后才揭晓的后果与签约发行商后的专属建议。同一段日常也可能带来不同结果。普通日常与隐藏后果共用场景、选项和样式，选择前不提示效果；选择后显示实际变化并保存。发行商仅协助游戏内容、程序构架和商业化，可推进完成度或提高软上限。每周按刚结算的进度、上限、上游依赖、预算、技术债、士气、资金与合约状态重新筛选事件和选项，并提高当前短板相关事件的权重；不会连续重复同一事件。</p><p><strong>每一周：</strong>支付工资、维护、工具和买量费用，推进安排，再触发一次事件。无固定周数上限。发售或终止结算经验，项目和生涯共同保存，能力、资金与全局伙伴跨关继承。</p></div><div class="dialog-actions"><button data-action="close" class="btn-primary">回到工作室</button></div>`,'help');}

  function showWorkCapWarning(warnings,buying=G.buyingStatus(run)){
    const unfunded=buying.unfunded;
    showDialog(dialogHeader('CHECK YOUR ASSIGNMENTS',unfunded?'买量还没有设置投放预算。':'有伙伴的工作已到达上限。')+`${unfunded?'<div class="buying-status warning"><strong>'+esc(buying.members.map(m=>m.name).join('、'))+' · 买量</strong><p>预算为 ¥0，本周买量无进度、不扣投放费，但团队工资照付。请设置预算'+(buying.managed?'；发行团队的其他工作照常推进。':'，或调整这些伙伴的岗位。')+'</p></div>':''}${warnings.length?'<p class="dialog-desc">以下岗位已到达完成度上限，继续安排不会获得正向进度：</p>':''}<ul class="work-cap-list">${warnings.map(w=>`<li><strong>${esc(w.members.map(m=>m.name).join('、'))} · ${w.name}</strong><span>当前 ${w.completion.toFixed(1)}% / ${w.full?'刚性上限':'软上限'} ${w.cap}%</span>${w.ongoing?'<small>'+w.ongoing+'。</small>':''}${w.rework?'<small>真实模式下仍可能返工，降低当前完成度。</small>':''}</li>`).join('')}</ul><p class="warning-note">继续推进仍会支付本周工资、维护和投放等费用。${run.hard?'真实模式的实际结算仍包含阶段减速、返工与牵连。':''}</p><div class="dialog-actions">${unfunded?'<button data-action="open-ad-budget" class="btn-primary">去设置买量预算</button>':''}<button data-action="close" class="${unfunded?'btn-ghost':'btn-primary'}">返回调整分工</button><button data-action="confirm-advance" data-run="${run.id}" data-week="${run.week}" class="btn-ghost">仍然推进一周 →</button></div>`,'work-cap-warning');
  }
  function advanceWeek(){const result=G.advance(run);if(!result.ok)toast(result.reason);hiddenPrompt=false;render();}

  function finish(released){const r=G.finish(run,released);if(!r){toast('请先完成当前选择，或检查发售准备。');return;}meta=G.settle(meta,run);close();save();render();result();}
  document.addEventListener('input',e=>{if(e.target.matches('#setup-form input[name="name"]')&&!e.isComposing){$('setup-error').textContent='';updateProjectNameValidation();}});
  document.addEventListener('compositionend',e=>{if(e.target.matches('#setup-form input[name="name"]'))updateProjectNameValidation();});
  document.addEventListener('change',e=>{const el=e.target;if(el.id==='ad-budget'&&run){G.setAdBudget(run,Number(el.value));render();return;}if(!el.matches('select[data-member]')||!run)return;const ok=G.assignMember(run,el.dataset.member,el.value);if(!ok)toast('这个岗位暂时不能分配。');render();});
  document.addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();const name=new FormData(e.target).get('heroName');if(!G.renameHero(meta,name))toast('请先暂停或结算项目再修改称呼。');render();return;}if(e.target.id!=='setup-form')return;e.preventDefault();if(!updateProjectNameValidation())return;const fd=new FormData(e.target);try{run=G.newRun({scale:setupScale,name:fd.get('name'),hard:fd.get('difficulty')==='hard',seed:fd.get('seed'),objective:fd.get('objective')},meta);}catch(err){$('setup-error').textContent=err.message;return;}view='game';tab='work';workModule='content';hiddenPrompt=false;close();render();window.scrollTo(0,0);});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;e.preventDefault();const a=b.dataset.action;
    if(a==='close'){const result=dialogKind==='event-result';if(result)G.acknowledgeEvent(run);hiddenPrompt=true;close();if(result)render();return;}
    if(a==='audio'){const st=audio.getState();audio.setSettings({muted:!(st.settings?.muted??st.muted)});audio.unlock();return;}
    if(a==='startup-aid'){
      const form=$('setup-form'),draft=form?Object.fromEntries(new FormData(form)):null;
      const amount=G.claimStartupAid(meta,run);if(!amount){toast(G.startupAidStatus(meta,run).reason);return;}
      close();render();
      if(draft){setup(setupScale);const next=$('setup-form');for(const [key,value] of Object.entries(draft))next.elements[key].value=value;updateProjectNameValidation();}
      toast('创业补助 +'+yen(amount)+'，生涯资金已补足至 '+yen(G.INITIAL_FUNDS)+'。');return;
    }
    if(a==='help'){help();return;}
    if(a==='setup'){setup(b.dataset.scale);return;}
    if(a==='setup-scale'){const form=$('setup-form'),name=form.elements.name.value,mode=form.elements.difficulty.value,objective=form.elements.objective.value,seed=form.elements.seed.value,old=G.SCALES.find(g=>g.id===setupScale).title;setup(b.dataset.scale);if(name&&name!==old)$('setup-form').elements.name.value=name;$('setup-form').elements.difficulty.value=mode;$('setup-form').elements.objective.value=objective;$('setup-form').elements.seed.value=seed;updateProjectNameValidation();return;}
    if(['home','nav','continue','career'].includes(a)){view=a==='nav'?b.dataset.view:a==='continue'?'game':a==='career'?'career':'home';close();hiddenPrompt=false;render();window.scrollTo(0,0);return;}
    if(a==='end-project'){confirmEndProject(b.dataset.id);return;}
    if(a==='release-ended-project'){releaseEndedProject(b.dataset.id);return;}
    if(a==='confirm-end-project'){endCurrentOrPausedProject(b.dataset.id);return;}
    if(a==='pause-project'){pauseCurrentProject();return;}
    if(a==='pause-setup'){const scale=b.dataset.scale;if(pauseCurrentProject())setup(scale);return;}
    if(a==='resume-project'){const resumed=G.resumeProject(meta,b.dataset.id,run);if(!resumed){toast('当前无法恢复这个项目。');return;}run=resumed;view='game';tab='work';workModule='content';hiddenPrompt=false;close();render();window.scrollTo(0,0);return;}
    if(a==='history-filter'){if(['all','active','paused','released','aborted'].includes(b.dataset.filter))historyFilter=b.dataset.filter;render();return;}
    if(a==='history-result'){const record=meta.history.find(r=>r.runId===b.dataset.id);if(record)result(record);return;}
    if(a==='result'){result();return;}
    if(a==='tab'){tab=b.dataset.tab;render();return;}
    if(a==='open-ad-budget'){close();tab='work';workModule='promotion';render();$('ad-budget')?.focus();return;}
    if(a==='work-module'){selectWorkModule(b.dataset.module);return;}
    if(a==='train'){if(!G.train(meta,b.dataset.skill))toast('当前无法训练，请检查经验或先暂停项目。');render();return;}
    if(a==='recruit-filter'){if(['all',...G.PERSON_RANKS.map(r=>r.id)].includes(b.dataset.rank))recruitFilter=b.dataset.rank;render();return;}
    if(a==='career-hire'){if(!G.hirePartner(meta,b.dataset.id))toast('当前无法邀请，请检查资金或先结算项目。');render();return;}
    if(a==='career-dismiss'){const member=G.RECRUITS.find(r=>r.id===b.dataset.id);if(!member||meta.activeRunId)return;showDialog(dialogHeader('TEAM CHANGE','与'+esc(member.name)+'暂别？')+'<p class="dialog-desc">支付 ¥100，之后不再计算这位伙伴的工资。结识关系保留，后续可再次邀请。</p><div class="dialog-actions"><button data-action="close">继续同行</button><button data-action="confirm-career-dismiss" data-id="'+member.id+'">确认暂别 · ¥100</button></div>','career-dismiss');return;}
    if(a==='confirm-career-dismiss'){G.dismissPartner(meta,b.dataset.id);close();render();return;}
    if(a==='reset-career'){if(meta.activeRunId)return;showDialog(dialogHeader('A FRESH CAREER','重新开始整个生涯？')+'<p class="dialog-desc">资金恢复到 ¥7,600，主角五项能力恢复为 100%。已加入伙伴、后续结识关系、经验和作品履历都会清空，恢复为初始可结识名单。</p><div class="dialog-actions"><button data-action="close">保留当前生涯</button><button data-action="confirm-reset-career">确认重新开始</button></div>','reset-career');return;}
    if(a==='confirm-reset-career'){if(meta.activeRunId)return;meta=G.emptyMeta();run=null;close();view='career';render();return;}
    if(!run||run.over)return;
    if(a==='prompt'){if(run.pendingEvent)showEvent();else if(run.eventResult?.unread)showEventResult();return;}
    if(a==='event-result-done'){G.acknowledgeEvent(run);close();hiddenPrompt=false;render();return;}
    if(a==='event'){if(G.resolveEvent(run,Number(b.dataset.index))){close();hiddenPrompt=false;render();}return;}
    if(a==='release'){release();return;}
    if(a==='dismiss'){const m=run.team.find(m=>m.id===b.dataset.id);if(!m||m.kind!=='partner'||busy())return;showDialog(dialogHeader('UNTIL NEXT TIME','与'+esc(m.name)+'暂别？')+`<p class="dialog-desc">支付 ¥100 安置费，之后不再计入${esc(m.name)}的周薪。本项目内不能再次邀请；结识关系会保留到后续关卡。此操作占用本周管理行动。</p><div class="dialog-actions"><button data-action="close" class="btn-ghost">继续同行</button><button data-action="downsize" data-id="${m.id}">确认暂别 · ¥100</button></div>`,'dismiss');return;}
    if(a==='confirm-release'){finish(true);return;}
    if(a==='abort'){confirmEndProject(run.id);return;}
    if(busy()){toast('请先完成当前随机事件选择。');return;}
    if(a==='auto-assign'){
      const plan=G.autoAssign(run);
      if(!plan.ok){toast(plan.reason);return;}
      if(!plan.improved){showDialog(dialogHeader('TEAM ASSIGNMENTS','无法优化任务分配了')+`<p class="dialog-desc">${plan.exact?'当前分工已达到本周预估的最大总进展。':'本次搜索岗位调换与人员交换，未找到比当前更好的分配；大团队搜索不保证全局最优。'}开发总完成度预计 +${plan.beforeProgress.toFixed(3)}%，无需调整人物岗位。</p><p class="quality-note">已计入转岗磨合、同岗协作、上下游依赖、完成度上限与现有预算。真实模式按满效率预估。你仍可根据偿债或长期目标手动安排。</p><div class="dialog-actions"><button class="btn-primary" data-action="close">保持当前分工</button></div>`,'auto-assignment');return;}
      render();toast('已自动调整 '+plan.changes.length+' 人的工作，计入转岗与上限折损。'+(plan.beforeCost!==plan.afterCost?'本周支出 '+yen(plan.beforeCost)+' → '+yen(plan.afterCost)+'。':''));return;
    }
    if(a==='advance'){const warnings=G.softCapWarnings(run),buying=G.buyingStatus(run);if(warnings.length||buying.unfunded)showWorkCapWarning(warnings,buying);else advanceWeek();return;}
    if(a==='confirm-advance'){if(b.dataset.run!==run.id||Number(b.dataset.week)!==run.week){close();toast('项目状态已变化，请重新检查分工。');return;}close();advanceWeek();return;}
    let ok=true;

    if(a==='publisher-contract'){confirmPublisher();return;}
    if(a==='confirm-publisher'){ok=G.signPublisher(run);close();if(ok)toast('预付款已到账，宣发与上架由发行团队接管。请重新安排待命人物。');}
    if(a==='budget')ok=G.setAdBudget(run,Number(b.dataset.value));

    if(a==='pace'){run.pace=b.dataset.pace;}
    if(a==='assign')ok=G.assign(run,b.dataset.job,Number(b.dataset.delta));
    if(a==='hire')ok=G.hire(run,b.dataset.id);
    if(a==='downsize'){ok=G.downsize(run,b.dataset.id);close();}
    if(!ok&&a!=='advance')toast('当前条件不满足，操作未执行。');render();
  });
  dialog.addEventListener('cancel',()=>{const result=dialogKind==='event-result';if(result)G.acknowledgeEvent(run);hiddenPrompt=true;dialogKind='';if(result)render();});
  document.addEventListener('keydown',e=>{const b=e.target.closest('[data-action="work-module"]');if(!b||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=G.GROUPS.findIndex(g=>g.id===b.dataset.module),n=G.GROUPS.length,next=e.key==='Home'?0:e.key==='End'?n-1:(i+(e.key==='ArrowRight'?1:-1)+n)%n;selectWorkModule(G.GROUPS[next].id);$('work-tab-'+G.GROUPS[next].id)?.scrollIntoView({block:'nearest',inline:'nearest'});});
  document.addEventListener('keydown',e=>{if(e.key===' '&&view==='game'&&!dialog.open&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();document.querySelector('.next-week')?.click();}});
  // Terminating a project is always visible from its history tab, including an exhausted budget.
  const originalLogs=logs;logs=function(){return originalLogs()+(!run.over?'<div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn-ghost btn-small" data-action="abort">结束当前项目并回收资金</button></div>':'');};
  if(run&&run.over){meta=G.settle(meta,run);}render();
})();

</script>
</body>
